<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:673px;height:565px;background:#FFFFFF;" width="673px" height="565px" viewBox="0 0 673 565" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="4"><text x="10" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">two different tools: the index narrows the scan, the hot row serialises the writers</text></g><!--cluster P1--><g class="cluster" data-qualified-name="P1" id="ent0001" data-source-line="9"><rect x="11.704" y="44.297" width="293" height="277.83" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="19.633" y="56.507" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">INDEX — how many rows the engine touches</text></g><!--cluster P2--><g class="cluster" data-qualified-name="P2" id="ent0010" data-source-line="21"><rect x="89.704" y="371.127" width="292" height="180.62" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="97.64" y="383.337" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">HOT ROW — who may touch one row at once</text></g><!--entity Q--><g class="entity" data-qualified-name="P1.Q" id="ent0002" data-source-line="10"><rect x="90.374" y="83.297" width="128.652" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="100.374" y="103.507" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">query</text><text x="100.374" y="116.312" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">a donor's donations</text></g><!--entity I--><g class="entity" data-qualified-name="P1.I" id="ent0003" data-source-line="11"><rect x="92.474" y="167.907" width="118.458" height="45.609" fill="#EAF3EC" style="stroke:#1F6F4A;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="124.12" y="188.117" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«derived»</text><text x="102.474" y="200.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">index on donor_id</text></g><!--entity R--><g class="entity" data-qualified-name="P1.R" id="ent0004" data-source-line="12"><rect x="90.504" y="252.517" width="124.409" height="45.609" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="110.416" y="272.727" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="100.504" y="285.532" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">few matching rows</text></g><!--entity W1--><g class="entity" data-qualified-name="P2.W1" id="ent0011" data-source-line="22"><rect x="121.364" y="410.127" width="62.673" height="32.805" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="131.364" y="430.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">writer 1</text></g><!--entity W2--><g class="entity" data-qualified-name="P2.W2" id="ent0012" data-source-line="23"><rect x="200.364" y="410.127" width="62.673" height="32.805" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="210.364" y="430.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">writer 2</text></g><!--entity W3--><g class="entity" data-qualified-name="P2.W3" id="ent0013" data-source-line="24"><rect x="279.364" y="410.127" width="62.673" height="32.805" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="289.364" y="430.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">writer 3</text></g><!--entity HR--><g class="entity" data-qualified-name="P2.HR" id="ent0014" data-source-line="25"><rect x="143.424" y="469.337" width="176.567" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="189.416" y="489.547" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="153.424" y="502.352" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">one contended row</text><text x="153.424" y="515.157" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(e.g. a counter or stock row)</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="17"><path d="M329.204,172.907 L329.204,208.516 L586.205,208.516 L586.205,182.907 L576.205,172.907 L329.204,172.907" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M576.205,172.907 L576.205,182.907 L586.205,182.907 L576.205,172.907" style="stroke:#BDBDB0;stroke-width:1;" fill="#FBFBF6"/><text x="335.204" y="188.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">The index is a copy of an ordering; it taxes</text><text x="335.204" y="200.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">every write to the indexed column.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="31"><path d="M405.354,467.927 L405.354,529.146 L654.051,529.146 L654.051,477.927 L644.051,467.927 L405.354,467.927" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M644.051,467.927 L644.051,477.927 L654.051,477.927 L644.051,467.927" style="stroke:#BDBDB0;stroke-width:1;" fill="#FBFBF6"/><text x="411.354" y="483.137" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Every writer serialises on the same row.</text><text x="411.354" y="495.942" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Arbitration - a conditional update, a lock</text><text x="411.354" y="508.747" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">plus recheck, or pre-created units - is the</text><text x="411.354" y="521.551" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">design question, not structure.</text></g><!--link Q to I--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="13" data-link-type="dependency"><path d="M153.904,129.237 C153.474,141.097 153.125,150.65 152.695,162.52" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-I"/><polygon points="152.514,167.517,156.837,158.668,152.695,162.52,148.842,158.378,152.514,167.517" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="154.474" y="153.046" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">lookup</text></g><!--link I to R--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk6" data-source-line="14" data-link-type="dependency"><path d="M151.974,213.847 C152.114,225.707 152.235,235.257 152.375,247.127" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="I-to-R"/><polygon points="152.434,252.127,156.328,243.08,152.375,247.127,148.328,243.175,152.434,252.127" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="153.294" y="237.656" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">narrow path</text></g><!--link P1 to GMN7--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk9" data-source-line="17" data-link-type="association"><path d="M304.94,111.329 C305.042,111.382 305.146,111.435 305.25,111.488 C305.459,111.595 305.671,111.704 305.886,111.815 C307.609,112.698 309.544,113.691 311.666,114.78 C320.154,119.135 331.632,125.024 344.444,131.598 C370.069,144.747 401.034,160.637 424.104,172.477" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="P1-GMN7"/></g><!--link W1 to HR--><g class="link" data-entity-1="ent0011" data-entity-2="ent0014" id="lnk15