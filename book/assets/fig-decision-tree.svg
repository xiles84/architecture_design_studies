<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:473px;height:683px;background:#FFFFFF;" width="473px" height="683px" viewBox="0 0 473 683" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="6"><text x="164.789" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">the decision path</text></g><!--entity D1--><g class="entity" data-qualified-name="D1" id="ent0001" data-source-line="8"><rect x="119.48" y="44.297" width="219.864" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="129.48" y="64.507" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">1. What must the schema answer —</text><text x="129.48" y="77.312" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">after an undo, a cancellation,</text><text x="129.48" y="90.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">a correction?</text></g><!--entity D2--><g class="entity" data-qualified-name="D2" id="ent0002" data-source-line="9"><rect x="126.81" y="162.707" width="205.201" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="136.81" y="182.917" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">2. Can the current representation</text><text x="136.81" y="195.722" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer it? If not, change the</text><text x="136.81" y="208.527" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">representation before the speed.</text></g><!--entity D3--><g class="entity" data-qualified-name="D3" id="ent0003" data-source-line="10"><rect x="143.5" y="281.117" width="171.819" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="153.5" y="301.327" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">3. Is there a contended row</text><text x="153.5" y="314.132" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">or a hot drop?</text></g><!--entity D4--><g class="entity" data-qualified-name="D4" id="ent0004" data-source-line="11"><rect x="7" y="393.127" width="200.818" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="413.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">4. If not: leave the row canonical</text><text x="17" y="426.142" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">and index the question.</text></g><!--entity D5--><g class="entity" data-qualified-name="D5" id="ent0005" data-source-line="12"><rect x="242.88" y="386.727" width="217.06" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="252.88" y="406.937" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">5. If yes: arbitrate it — conditional</text><text x="252.88" y="419.742" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">update, lock plus invariant recheck,</text><text x="252.88" y="432.547" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">or pre-created rows.</text></g><!--entity D6--><g class="entity" data-qualified-name="D6" id="ent0006" data-source-line="13"><rect x="121.94" y="505.147" width="214.944" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="131.94" y="525.357" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">6. Is any read derived? Name the</text><text x="131.94" y="538.162" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">maintainer, the transaction it</text><text x="131.94" y="550.967" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">shares, and the freshness contract.</text></g><!--entity D7--><g class="entity" data-qualified-name="D7" id="ent0007" data-source-line="14"><rect x="122.7" y="623.557" width="213.418" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="132.7" y="643.767" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">7. State the evidence level and the</text><text x="132.7" y="656.572" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">gap before quoting any number.</text></g><!--link D1 to D2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M229.41,102.977 C229.41,121.017 229.41,139.267 229.41,157.327" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="D1-to-D2"/><polygon points="229.41,162.327,233.41,153.327,229.41,157.327,225.41,153.327,229.41,162.327" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link D2 to D3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-source-line="17" data-link-type="dependency"><path d="M229.41,221.527 C229.41,239.997 229.41,258.657 229.41,275.697" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="D2-to-D3"/><polygon points="229.41,280.697,233.41,271.697,229.41,275.697,225.41,271.697,229.41,280.697" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link D3 to D4--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-source-line="18" data-link-type="dependency"><path d="M204.72,327.187 C183.55,346.277 156.933,370.279 135.773,389.359" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="D3-to-D4"/><polygon points="132.06,392.707,141.423,389.651,135.773,389.359,136.065,383.709,132.06,392.707" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;s