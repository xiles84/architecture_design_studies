<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:730px;height:380px;background:#FFFFFF;" width="730px" height="380px" viewBox="0 0 730 380" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="4"><text x="10" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">source correctness belongs to the mutation; copy correctness belongs to the publication</text></g><!--entity CL--><g class="entity" data-qualified-name="CL" id="ent0001" data-source-line="9"><rect x="268.124" y="44.297" width="50.212" height="32.805" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="278.124" y="64.507" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">client</text></g><!--entity APP--><g class="entity" data-qualified-name="APP" id="ent0002" data-source-line="10"><rect x="226.534" y="118.107" width="133.378" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="236.534" y="138.317" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">application</text><text x="236.534" y="151.122" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(readers + writer W)</text></g><!--entity DB--><g class="entity" data-qualified-name="DB" id="ent0003" data-source-line="11"><rect x="62.594" y="204.717" width="111.266" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="75.935" y="224.927" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="72.594" y="237.732" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">source database</text><text x="72.594" y="250.537" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(authoritative)</text></g><!--entity K--><g class="entity" data-qualified-name="K" id="ent0004" data-source-line="12"><rect x="201.974" y="305.527" width="182.508" height="58.414" fill="#FBF3E6" style="stroke:#8A5A00;stroke-width:1.5;stroke-dasharray:7,7;" rx="2.5" ry="2.5"/><text x="263.614" y="325.737" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«external»</text><text x="211.974" y="338.542" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">cache</text><text x="211.974" y="351.347" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(non-authoritative read copy)</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="20"><path d="M191.364,209.717 L191.364,229.917 L174.304,233.917 L191.364,237.917 L191.364,258.131 A0,0 0 0 0 191.364,258.131 L433.084,258.131 A0,0 0 0 0 433.084,258.131 L433.084,219.717 L423.084,209.717 L191.364,209.717 A0,0 0 0 0 191.364,209.717" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M423.084,209.717 L423.084,219.717 L433.084,219.717 L423.084,209.717" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="197.364" y="224.927" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">source correctness: a lock + invariant</text><text x="197.364" y="237.732" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">recheck or a conditional update decides</text><text x="197.364" y="250.537" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">who wins the mutation.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="25"><path d="M402.844,304.127 L402.844,330.737 L384.804,334.737 L402.844,338.737 L402.844,365.346 A0,0 0 0 0 402.844,365.346 L659.619,365.346 A0,0 0 0 0 659.619,365.346 L659.619,314.127 L649.619,304.127 L402.844,304.127 A0,0 0 0 0 402.844,304.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M649.619,304.127 L649.619,314.127 L659.619,314.127 L649.619,304.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="408.844" y="319.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">copy correctness: propagation, publication</text><text x="408.844" y="332.142" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">or hit validation orders what leaves the</text><text x="408.844" y="344.947" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">transaction. The freshness contract says</text><text x="408.844" y="357.751" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">what a hit is allowed to mean.</text></g><!--link CL to APP--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="14" data-link-type="dependency"><path d="M293.224,77.527 C293.224,89.137 293.224,100.037 293.224,112.887" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="CL-to-APP"/><polygon points="293.224,117.887,297.224,108.887,293.224,112.887,289.224,108.887,293.224,117.887" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="294.224" y="102.246" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">request</text></g><!--link APP to DB--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="15" data-link-type="dependency"><path d="M250.414,164.177 C227.144,176.277 202.54,189.069 177.61,202.039" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="APP-to-DB"/><polygon points="173.174,204.347,183.004,203.742,177.61,202.039,179.312,196.645,173.174,204.347" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="222.404" y="188.856" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">mutation · authoritative read</text></g><!--link APP to K--><g class="link" d