<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:705px;height:400px;background:#FFFFFF;" width="705px" height="400px" viewBox="0 0 705 400" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="4"><text x="117.446" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">normalized child rows vs an embedded bounded collection</text></g><!--cluster N--><g class="cluster" data-qualified-name="N" id="ent0001" data-source-line="9"><rect x="7" y="44.297" width="286" height="244.23" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="14.503" y="56.507" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">normalized — many independent child rows</text></g><!--cluster E--><g class="cluster" data-qualified-name="E" id="ent0008" data-source-line="20"><rect x="329" y="176.707" width="362" height="118.22" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="336.788" y="188.917" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">embedded — the child collection lives in the parent row</text></g><!--entity ND--><g class="entity" data-qualified-name="N.ND" id="ent0002" data-source-line="10"><rect x="101.14" y="75.297" width="153.719" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="135.707" y="95.507" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="111.14" y="108.312" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Donor</text><text x="111.14" y="121.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">donor_id · display_name</text></g><!--entity ND2--><g class="entity" data-qualified-name="N.ND2" id="ent0003" data-source-line="11"><rect x="80.53" y="214.107" width="194.931" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="135.704" y="234.317" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="90.53" y="247.122" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Donation</text><text x="90.53" y="259.927" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">donation_id · donor_id · amount</text></g><!--entity ED--><g class="entity" data-qualified-name="E.ED" id="ent0009" data-source-line="21"><rect x="351.27" y="207.707" width="249.458" height="71.219" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="433.707" y="227.917" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="361.27" y="240.722" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Donor</text><text x="361.27" y="253.527" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">donor_id · display_name</text><text x="361.27" y="266.331" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">donations: [ { donation_id, amount }, … ]</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="15"><path d="M34.97,330.327 L34.97,378.741 A0,0 0 0 0 34.97,378.741 L317.037,378.741 A0,0 0 0 0 317.037,378.741 L317.037,340.327 L307.037,330.327 L180.43,330.327 L177.47,273.017 L172.43,330.327 L34.97,330.327 A0,0 0 0 0 34.97,330.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M307.037,330.327 L307.037,340.327 L317.037,340.327 L307.037,330.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="40.97" y="345.537" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Reading the whole aggregate needs the parent</text><text x="40.97" y="358.342" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">and its children; each child is queryable and</text><text x="40.97" y="371.147" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">updatable on its own.</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="24"><path d="M333.08,323.927 L333.08,385.146 A0,0 0 0 0 333.08,385.146 L624.923,385.146 A0,0 0 0 0 624.923,385.146 L624.923,333.927 L614.923,323.927 L482.18,323.927 L476.96,279.177 L474.18,323.927 L333.08,323.927 A0,0 0 0 0 333.08,323.927" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M614.923,323.927 L614.923,333.927 L624.923,333.927 L614.923,323.927" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="339.08" y="339.137" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Reading the whole bounded aggregate is local to</text><text x="339.08" y="351.942" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">one row; querying or updating one independent</text><text x="339.08" y="364.747" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">child is less convenient, and an unbounded</text><text x="339.08" y="377.551" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">collection is dangerous.</text></g><!--link ND to ND2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="12" data-link-type="dependency"><path d="M178,134.187 C178,157.537 178,185.337 178,208.677" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="ND-to-ND2"/><polygon points="178,213.677,182,204.677,178,208.677,174,204.677,178,213.677" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="179" y="157.846" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">has many</text></g><!--link ND2 to ED--><?