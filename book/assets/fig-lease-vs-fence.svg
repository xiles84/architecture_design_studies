 Arial'">4 accept; record token 8</text><polygon points="492.342,735.219,502.342,739.219,492.342,743.219,496.342,739.219" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="62.692" y1="739.219" x2="498.342" y2="739.219" style="stroke:#5A6B7D;stroke-width:1;"/><text x="69.692" y="734.389" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">5 publish (S0, token 7)</text><polygon points="73.692,763.188,63.692,767.188,73.692,771.188,69.692,767.188" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="67.692" y1="767.188" x2="503.342" y2="767.188" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="79.692" y="762.357" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">6 reject — 7 is older than 8</text><path d="M368.134,780.188 L368.134,828.188 L640.134,828.188 L640.134,790.188 L630.134,780.188 L368.134,780.188" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M630.134,780.188 L630.134,790.188 L640.134,790.188 L630.134,780.188" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="374.134" y="795.398" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">The sink orders operations only once a newer</text><text x="374.134" y="808.203" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">token has reached it. If token 7 had arrived</text><text x="374.134" y="821.007" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">first, the sink would have accepted it.</text><path d="M27.465,852.602 L27.465,913.602 L539.465,913.602 L539.465,862.602 L529.465,852.602 L27.465,852.602" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M529.465,852.602 L529.465,862.602 L539.465,862.602 L529.465,852.602" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="103.96" y="867.812" fill="#000" font-size="11" font-family