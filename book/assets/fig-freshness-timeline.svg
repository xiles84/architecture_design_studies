<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:503px;height:388px;background:#FFFFFF;" width="503px" height="388px" viewBox="0 0 503 388" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="5"><text x="15" y="27.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">the strict-after-acknowledgement contract, on one timeline</text></g><g><title>writer W</title><rect x="169.817" y="76.266" width="8" height="272.313" fill="#000" fill-opacity="0"/><line x1="173.317" y1="76.266" x2="173.317" y2="348.578" style="stroke:#5A6B7D;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>source</title><rect x="247.302" y="76.266" width="8" height="272.313" fill="#000" fill-opacity="0"/><line x1="250.802" y1="76.266" x2="250.802" y2="348.578" style="stroke:#5A6B7D;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>reader R</title><rect x="330.194" y="76.266" width="8" height="272.313" fill="#000" fill-opacity="0"/><line x1="333.694" y1="76.266" x2="333.694" y2="348.578" style="stroke:#5A6B7D;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="137.155" y="47.297" width="72.324" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="144.155" y="65.436" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">writer W</text><rect x="221.252" y="47.297" width="59.1" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="228.252" y="65.436" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">source</text><rect x="297.585" y="47.297" width="72.219" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="304.585" y="65.436" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">reader R</text><rect x="137.155" y="348.578" width="72.324" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="144.155" y="366.717" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">writer W</text><rect x="221.252" y="348.578" width="59.1" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="228.252" y="366.717" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">source</text><rect x="297.585" y="348.578" width="72.219" height="27.969" fill="#E8EDF4" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="304.585" y="366.717" fill="#000" font-size="12" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">reader R</text><polygon points="238.802,100.234,248.802,104.234,238.802,108.234,242.802,104.234" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="173.317" y1="104.234" x2="244.802" y2="104.234" style="stroke:#5A6B7D;stroke-width:1;"/><text x="180.317" y="99.404" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">write W1</text><polygon points="184.317,128.203,174.317,132.203,184.317,136.203,180.317,132.203" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="178.317" y1="132.203" x2="249.802" y2="132.203" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="190.317" y="127.373" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">commit</text><polygon points="321.694,156.172,331.694,160.172,321.694,164.172,325.694,160.172" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="173.317" y1="160.172" x2="327.694" y2="160.172" style="stroke:#5A6B7D;stroke-width:1;"/><text x="180.317" y="155.342" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">ack(W1) observed</text><polygon points="261.802,184.141,251.802,188.141,261.802,192.141,257.802,188.141" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.802" y1="188.141" x2="332.694" y2="188.141" style="stroke:#5A6B7D;stroke-width:1;"/><text x="267.802" y="183.311" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">begin(R1)</text><path d="M128.231,201.141 L128.231,262.141 L378.231,262.141 L378.231,211.141 L368.231,201.141 L128.231,201.141" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M368.231,201.141 L368.231,211.141 L378.231,211.141 L368.231,201.141" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="134.231" y="216.351" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">The contract binds here and not before:</text><text x="134.231" y="229.156" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">begin(R1) > ack(W1) implies R1 must not</text><text x="134.231" y="241.96" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">return a version older than W1, unless a</text><text x="134.231" y="254.765" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">later write to the key supersedes it.</text><path d="M123.4,272.359 L123.4,333.359 L377.4,333.359 L377.4,282.359 L367.4,272.359 L123.4,272.359" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M367.4,272.359 L367.4,282.359 L377.4,282.359 L367.4,272.359" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="129.4" y="287.57" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Every relaxed contract is a named</text><text x="129.4" y="300.375" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">weakening of that line; bounded staleness</text><text x="129.4" y="313.179" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">adds a declared delta to it, and the</text><text x="129.4" y="325.984" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">measured relaxed cells declare no delta.</text><?plantuml-src ZL9BZXCn4DttAOhPa97I4U6t2D8iHi018gHUeagxaXHnsosxd90TX-24d8JdZfAPOONKKils-zNdbORU5oVqFTlPos8iWszUqsEC1zhghYIXFxz-a-s5iYNjhUMjIMgvFuHuyk9sCaWmwcEmnBtHwBaNHp7W4p8Tn6kG1JI_nZIidcxeor6TXBuAivMygXgzZ5ROatfVuCUc4Ae1rCWbFkKfoTKCelKu26S4TTHxrY4J8_IFWcIEUCSQij7i-BPTVfpJyLtxvltbz-6UE02HioJB52B13a5DpSl_5pp_jzIc6JcPzZeoO7UdfA1JTmSdwbw-vLXIBzFBvyUNJqdOWRQU7jTDqr7x012jQ1AaRjdWrEAoezgvOL2xWDOu8-oiMzvJtA2uexXcVQDlPATXjbxUDo529nvhk3aiYBuzQorjDBXCUq4lQvi01dKRawo0l8dGmyrBXz6h8EoI1iokCe1COYK5Oe9FhiECljPbUmweOKubUCaO6Q2UQwCkvLcS9d2GC-KoWYeEqcgBHYvXv5byz8wmJPBEiFFyisx2jGo5DWKUq0EYa_11WeOTnMsDO5G7zeasiGG75XRHIq0UODcvIdM2fQgxvSGRrroAaTUE81zWjzsxEOlt-KghMpKHdtB_1G00?></g></svg>