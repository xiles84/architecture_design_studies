<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:587px;height:391px;background:#FFFFFF;" width="587px" height="391px" viewBox="0 0 587 391" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="4"><text x="59.618" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">undoing the state is not the same as erasing the evidence</text></g><!--cluster PA--><g class="cluster" data-qualified-name="PA" id="ent0001" data-source-line="9"><rect x="77.94" y="44.297" width="164" height="246.23" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="94.351" y="56.507" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">1 . current state only</text></g><!--cluster PB--><g class="cluster" data-qualified-name="PB" id="ent0008" data-source-line="19"><rect x="288.94" y="178.717" width="190" height="118.22" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:1;" rx="2.5" ry="2.5"/><text x="324.248" y="190.927" fill="#000" font-size="11" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">2 . retained history</text></g><!--entity A1--><g class="entity" data-qualified-name="PA.A1" id="ent0002" data-source-line="10"><rect x="106.65" y="75.297" width="106.584" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="117.65" y="95.507" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="122.001" y="108.312" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Donation</text><text x="122.001" y="121.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">status = PAID</text></g><!--entity A2--><g class="entity" data-qualified-name="PA.A2" id="ent0003" data-source-line="11"><rect x="94.39" y="216.117" width="131.101" height="58.414" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="117.649" y="236.327" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="104.39" y="249.132" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">refund applied</text><text x="104.39" y="261.937" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">status = REFUNDED</text></g><!--entity B1--><g class="entity" data-qualified-name="PB.B1" id="ent0009" data-source-line="20"><rect x="305.03" y="209.717" width="157.833" height="71.219" fill="#E8EDF4" style="stroke:#2B4B8F;stroke-width:1.5;" rx="2.5" ry="2.5"/><text x="341.655" y="229.927" fill="#000" font-size="11" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">«authoritative»</text><text x="315.03" y="242.732" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">DonationEvent</text><text x="315.03" y="255.537" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(event_id, donation_id,</text><text x="315.03" y="268.341" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">event_type, occurred_at)</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="15"><path d="M6,334.337 L6,369.946 A0,0 0 0 0 6,369.946 L267.888,369.946 A0,0 0 0 0 267.888,369.946 L267.888,344.337 L257.888,334.337 L144.7,334.337 L153.66,274.967 L136.7,334.337 L6,334.337 A0,0 0 0 0 6,334.337" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M257.888,334.337 L257.888,344.337 L267.888,344.337 L257.888,334.337" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="349.547" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">After the refund the PAID state is gone.</text><text x="12" y="362.352" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">"Was this ever paid?" is now unanswerable.</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="23"><path d="M285.72,327.937 L285.72,376.351 A0,0 0 0 0 285.72,376.351 L572.176,376.351 A0,0 0 0 0 572.176,376.351 L572.176,337.937 L562.176,327.937 L422.85,327.937 L398.93,281.227 L414.85,327.937 L285.72,327.937 A0,0 0 0 0 285.72,327.937" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M562.176,327.937 L562.176,337.937 L572.176,337.937 L562.176,327.937" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="291.72" y="343.147" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">PLEDGED -> PAID -> REFUNDED are appended.</text><text x="291.72" y="355.952" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">The same question is answered: undo the state,</text><text x="291.72" y="368.757" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">keep the evidence.</text></g><!--link A1 to A2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="12" data-link-type="dependency"><path d="M159.94,133.937 C159.94,157.887 159.94,186.987 159.94,210.937" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="A1-to-A2"/><polygon points="159.94,215.937,163.94,206.937,159.94,210.937,155.94,206.937,159.94,215.937" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="160.94" y="159.856" fill="#5A6B7D" font-size="12" font-family="'Segoe UI, Helvetica, Arial'">overwrite</text></g><!--link A2 to B1--><?plantuml-src XPDHYzD04CVVyod6-g126qWVvAXdvK9I4KGEKNomKlQoqsHfiXjtPrEA7FWX_8H-4cUJbCjfGVgGPcR-yz_zpUI9qaNj9SBEqQd6kFLD7Js3r9W3x5NfBSBldx-WyDQY9d0a2C7e-WIT0uiab4O9bN9ax2bcvSROPiLrrXV4wXZoJadK1VPQxrPG67vhoOiQL5rxBXMaZ7u5mZcqv40Ru1364Icg4RoMHkaIgCBHNuKQ6WAYGHO2Mk7EHJWwHcHQ80DtXiWq89N58ZX5xg1qAwnek8r4XoqaLvEW5VeGWikhA0eIeKi-nYo1-0A7MN2_lO6dcvH_B-57130HPKRt