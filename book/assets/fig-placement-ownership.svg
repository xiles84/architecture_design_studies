<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1041px;height:357px;background:#FFFFFF;" width="1041px" height="357px" viewBox="0 0 1041 357" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="5"><text x="262.541" y="22.995" fill="#000" font-size="14" textLength="509.776" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">Figure 1 — placement and ownership: where an answer may live</text></g><!--entity Q--><g class="entity" data-qualified-name="Q" id="ent0001" data-source-line="7"><rect x="441.2" y="44.297" width="215.766" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="451.2" y="64.507" fill="#000" font-size="11" textLength="69.072" font-family="'Segoe UI, Helvetica, Arial'">the question</text><text x="451.2" y="77.312" fill="#000" font-size="11" textLength="195.766" font-family="'Segoe UI, Helvetica, Arial'">total · extreme · feed · point lookup</text></g><!--entity derive--><g class="entity" data-qualified-name="derive" id="ent0002" data-source-line="9"><rect x="83.93" y="149.907" width="168.307" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.93" y="170.117" fill="#000" font-size="11" textLength="40.783" font-family="'Segoe UI, Helvetica, Arial'">DERIVE</text><text x="93.93" y="182.922" fill="#000" font-size="11" textLength="99.763" font-family="'Segoe UI, Helvetica, Arial'">answer at the leaf</text><text x="93.93" y="195.727" fill="#000" font-size="11" textLength="148.307" font-family="'Segoe UI, Helvetica, Arial'">(no copy, no maintenance)</text></g><!--entity index--><g class="entity" data-qualified-name="index" id="ent0003" data-source-line="10"><rect x="286.87" y="149.907" width="146.43" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="296.87" y="170.117" fill="#000" font-size="11" textLength="34.429" font-family="'Segoe UI, Helvetica, Arial'">INDEX</text><text x="296.87" y="182.922" fill="#000" font-size="11" textLength="113.19" font-family="'Segoe UI, Helvetica, Arial'">answer via structure</text><text x="296.87" y="195.727" fill="#000" font-size="11" textLength="126.43" font-family="'Segoe UI, Helvetica, Arial'">(a copy of an ordering)</text></g><!--entity mat--><g class="entity" data-qualified-name="mat" id="ent0004" data-source-line="11"><rect x="468.56" y="149.907" width="161.034" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="478.56" y="170.117" fill="#000" font-size="11" textLength="72.956" font-family="'Segoe UI, Helvetica, Arial'">MATERIALIZE</text><text x="478.56" y="182.922" fill="#000" font-size="11" textLength="115.624" font-family="'Segoe UI, Helvetica, Arial'">answer at the parent</text><text x="478.56" y="195.727" fill="#000" font-size="11" textLength="141.034" font-family="'Segoe UI, Helvetica, Arial'">(a copy of the aggregate)</text></g><!--entity down--><g class="entity" data-qualified-name="down" id="ent0005" data-source-line="12"><rect x="664.9" y="149.907" width="152.365" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="674.9" y="170.117" fill="#000" font-size="11" textLength="69.421" font-family="'Segoe UI, Helvetica, Arial'">COPY DOWN</text><text x="674.9" y="182.922" fill="#000" font-size="11" textLength="108.088" font-family="'Segoe UI, Helvetica, Arial'">answer on the child</text><text x="674.9" y="195.727" fill="#000" font-size="11" textLength="132.365" font-family="'Segoe UI, Helvetica, Arial'">(a copy of a parent key)</text></g><!--entity out--><g class="entity" data-qualified-name="out" id="ent0006" data-source-line="13"><rect x="852.3" y="149.907" width="175.558" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="862.3" y="170.117" fill="#000" font-size="11" textLength="56.617" font-family="'Segoe UI, Helvetica, Arial'">COPY OUT</text><text x="862.3" y="182.922" fill="#000" font-size="11" textLength="155.558" font-family="'Segoe UI, Helvetica, Arial'">answer beside the database</text><text x="862.3" y="195.727" fill="#000" font-size="11" textLength="123.965" font-family="'Segoe UI, Helvetica, Arial'">(a copy of the answer)</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M6,268.327 L6,342.35 A0,0 0 0 0 6,342.35 L330.161,342.35 A0,0 0 0 0 330.161,342.35 L330.161,278.327 L320.161,268.327 L172.08,268.327 L168.08,208.617 L164.08,268.327 L6,268.327 A0,0 0 0 0 6,268.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M320.161,268.327 L320.161,278.327 L330.161,278.327 L320.161,268.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="283.537" fill="#000" font-size="11" textLength="289.352" font-family="'Segoe UI, Helvetica, Arial'">Ownership rule. The leaf row stays canonical for row</text><text x="12" y="296.342" fill="#000" font-size="11" textLength="303.161" font-family="'Segoe UI, Helvetica, Arial'">questions. Every other box is a derived copy that owns</text><text x="12" y="309.147" fill="#000" font-size="11" textLength="275.806" font-family="'Segoe UI, Helvetica, Arial'">its own maintenance cost and its own correctness</text><text x="12" y="321.951" fill="#000" font-size="11" textLength="301.7" font-family="'Segoe UI, Helvetica, Arial'">contract. The ladder is ordered: each step adds a copy</text><text x="12" y="334.756" fill="#000" font-size="11" textLength="134.057" font-family="'Segoe UI, Helvetica, Arial'">and removes read work.</text></g><!--link Q to derive--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M471.98,90.367 C