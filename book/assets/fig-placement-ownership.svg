<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1041px;height:357px;background:#FFFFFF;" width="1041px" height="357px" viewBox="0 0 1041 357" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif"><g class="title" data-source-line="5"><text x="307.097" y="22.995" fill="#000" font-size="14" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">placement and ownership: where an answer may live</text></g><!--entity Q--><g class="entity" data-qualified-name="Q" id="ent0001" data-source-line="7"><rect x="441.2" y="44.297" width="215.766" height="45.609" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="451.2" y="64.507" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">the question</text><text x="451.2" y="77.312" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">total · extreme · feed · point lookup</text></g><!--entity derive--><g class="entity" data-qualified-name="derive" id="ent0002" data-source-line="9"><rect x="83.93" y="149.907" width="168.307" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="93.93" y="170.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">DERIVE</text><text x="93.93" y="182.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer at the leaf</text><text x="93.93" y="195.727" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(no copy, no maintenance)</text></g><!--entity index--><g class="entity" data-qualified-name="index" id="ent0003" data-source-line="10"><rect x="286.87" y="149.907" width="146.43" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="296.87" y="170.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">INDEX</text><text x="296.87" y="182.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer via structure</text><text x="296.87" y="195.727" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(a copy of an ordering)</text></g><!--entity mat--><g class="entity" data-qualified-name="mat" id="ent0004" data-source-line="11"><rect x="468.56" y="149.907" width="161.034" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="478.56" y="170.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">MATERIALIZE</text><text x="478.56" y="182.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer at the parent</text><text x="478.56" y="195.727" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(a copy of the aggregate)</text></g><!--entity down--><g class="entity" data-qualified-name="down" id="ent0005" data-source-line="12"><rect x="664.9" y="149.907" width="152.365" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="674.9" y="170.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">COPY DOWN</text><text x="674.9" y="182.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer on the child</text><text x="674.9" y="195.727" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(a copy of a parent key)</text></g><!--entity out--><g class="entity" data-qualified-name="out" id="ent0006" data-source-line="13"><rect x="852.3" y="149.907" width="175.558" height="58.414" fill="#FBFBF6" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="862.3" y="170.117" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">COPY OUT</text><text x="862.3" y="182.922" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">answer beside the database</text><text x="862.3" y="195.727" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">(a copy of the answer)</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M6,268.327 L6,342.35 A0,0 0 0 0 6,342.35 L330.161,342.35 A0,0 0 0 0 330.161,342.35 L330.161,278.327 L320.161,268.327 L172.08,268.327 L168.08,208.617 L164.08,268.327 L6,268.327 A0,0 0 0 0 6,268.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M320.161,268.327 L320.161,278.327 L330.161,278.327 L320.161,268.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="283.537" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">Ownership rule. The leaf row stays canonical for row</text><text x="12" y="296.342" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">questions. Every other box is a derived copy that owns</text><text x="12" y="309.147" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">its own maintenance cost and its own correctness</text><text x="12" y="321.951" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">contract. The ladder is ordered: each step adds a copy</text><text x="12" y="334.756" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">and removes read work.</text></g><!--link Q to derive--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="15" data-link-type="dependency"><path d="M471.98,90.367 C408.38,108.727 323.064,133.37 257.484,152.3" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-derive"/><polygon points="252.68,153.687,262.436,155.034,257.484,152.3,260.218,147.348,252.68,153.687" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Q to index--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="16" data-link-type="dependency"><path d="M510.83,90.367 C481.49,107.447 445.101,128.632 413.381,147.092" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-index"/><polygon points="409.06,149.607,418.851,148.537,413.381,147.092,414.827,141.623,409.06,149.607" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Q to mat--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="17" data-link-type="dependency"><path d="M549.08,90.367 C549.08,107.447 549.08,126.147 549.08,144.607" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-mat"/><polygon points="549.08,149.607,553.08,140.607,549.08,144.607,545.08,140.607,549.08,149.607" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Q to down--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk10" data-source-line="18" data-link-type="dependency"><path d="M587.93,90.367 C617.74,107.447 654.762,128.661 686.982,147.121" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-down"/><polygon points="691.32,149.607,685.499,141.662,686.982,147.121,681.522,148.603,691.32,149.607" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Q to out--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk11" data-source-line="19" data-link-type="dependency"><path d="M628.21,90.367 C693.03,108.607 779.877,133.043 847.057,151.943" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="Q-to-out"/><polygon points="851.87,153.297,844.29,147.009,847.057,151.943,842.123,154.71,851.87,153.297" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src TPFRQjj048RlzHJJtAI5nj1R5mffxKAWZPkI7Z6KYNOiBrdjghkpTdpNX-YxvBwFqYVflvASE8I2GAlLp3V_d9vONxjiX7uatJcPTBbrrJ6z3k6QLhR9KUW5_Vtrcph7jRJYbTWR2bilCQrjDu7nsn3RAIMDkLOuJ6Y-iKPyBRXZpMbATS1NfvaTMUSoJ5bjy3tOAhNS9TArm2vsEHqdGE_ZEJP68WMluJxko-9NSunM4lb0hN12R4CRTbacbLfr