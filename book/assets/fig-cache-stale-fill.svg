h d="M809.932,346.016 L809.932,356.016 L819.932,356.016 L809.932,346.016" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="519.932" y="361.226" fill="#000" font-size="11" textLength="242.768" font-family="'Segoe UI, Helvetica, Arial'">The fill carries a committed-but-older value;</text><text x="519.932" y="374.031" fill="#000" font-size="11" textLength="220.8" font-family="'Segoe UI, Helvetica, Arial'">a reader in another instance now hits it.</text><text x="519.932" y="386.835" fill="#000" font-size="11" textLength="285.844" font-family="'Segoe UI, Helvetica, Arial'">This is the race the claim's wrong reads came from.</text><path d="M30.284,417.43 L303.7,417.43 L303.7,423.398 L293.7,433.398 L30.284,433.398 L30.284,417.43" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="30.284" y="417.43" width="494.647" height="137.844" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="45.284" y="429.568" fill="#000" font-size="12" textLength="228.416" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">fenced: the publication is refused</text><polygon points="388.563,459.367,398.563,463.367,388.563,467.367,392.563,463.367" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="46.284" y1="463.367" x2="394.563" y2="463.367" style="stroke:#5A6B7D;stroke-width:1;"/><text x="53.284" y="458.537" fill="#5A6B7D" font-size="12" textLength="227.209" font-family="'Segoe UI, Helvetica, Arial'">version / CAS check before publishing</text><polygon points="57.284,487.336,47.284,491.336,57.284,495.336,53.284,491.336" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="51.284" y1="491.336" x2="399.563" y2="491.336" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="63.284" y="486.506" fill="#5A6B7D" font-size="12" textLength="187.857" font-family="'Segoe UI, Helvetica, Arial'">version moved — refuse the fill</text><polygon 