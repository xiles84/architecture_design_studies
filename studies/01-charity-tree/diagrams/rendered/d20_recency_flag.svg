oke:#000;stroke-width:1;"/></g><text x="158.37" y="303.365" fill="#000" font-size="11" textLength="150.75" font-family="'Segoe UI, Helvetica, Arial'">donated_at : TIMESTAMPTZ</text><text x="158.37" y="316.17" fill="#000" font-size="11" textLength="63.406" font-family="'Segoe UI, Helvetica, Arial'">note : TEXT</text><line x1="140.37" y1="322.764" x2="416.338" y2="322.764" style="stroke:#5A6B7D;stroke-width:1;"/><text x="145.37" y="336.975" fill="#000" font-size="11" textLength="161.514" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1er5t4gby3uze0)">* is_last_donation : BOOLEAN</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="38"><path d="M452.09,206.327 L452.09,265.027 L417.69,269.027 L452.09,273.027 L452.09,331.569 A0,0 0 0 0 452.09,331.569 L882.614,331.569 A0,0 0 0 0 882.614,331.569 L882.614,216.327 L872.614,206.327 L452.09,206.327 A0,0 0 0 0 452.09,206.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M872.614,206.327 L872.614,216.327 L882.614,216.327 L872.614,206.327" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="458.09" y="221.537" fill="#000" font-size="11" textLength="121.478" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">all D3 indexes, plus</text><text x="458.09" y="234.342" fill="#000" font-size="11" textLength="150.24" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_last_flag_idx</text><text x="611.827" y="234.342" fill="#000" font-size="11" textLength="104.205" font-family="'Segoe UI, Helvetica, Arial'">(donated_at DESC)</text><text x="719.528" y="234.342" fill="#000" font-size="11" textLength="148.086" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">WHERE is_last_donation</text><text x="458.09" y="247.147" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="458.09" y="259.951" fill="#000" font-size="11" textLength="278.642" font-family="'Segoe UI, Helvetica, Arial'">A PARTIAL index: exactly one TRUE row per donor,</text><text x="458.09" y="272.756" fill="#000" font-size="11" textLength="272.261" font-family="'Segoe UI, Helvetica, Arial'">so it stays one row per donor no matter how long</text><text x="458.09" y="285.561" fill="#000" font-size="11" textLength="142.098" font-family="'Segoe UI, Helvetica, Arial'">the study's history grows.</text><text x="458.09" y="298.365" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="458.09" y="311.17" fill="#000" font-size="11" textLength="286.371" font-family="'Segoe UI, Helvetica, Arial'">q13-q16 (RECENCY.md) read this column directly —</text><text x="458.09" y="323.975" fill="#000" font-size="11" textLength="172.272" font-family="'Segoe UI, Helvetica, Arial'">no aggregate, no second table.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="50"><path d="M11.54,566.397 L11.54,666.03 A0,0 0 0 0 11.54,666.03 L353.173,666.03 A0,0 0 0 0 353.173,666.03 L353.173,576.397 L343.173,566.397 L186.35,566.397 L182.35,506.877 L178.35,566.397 L11.54,566.397 A0,0 0 0 0 11.54,566.397" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M343.173,566.397 L343.173,576.397 L353.173,576.397 L343.173,566.397" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="17.54" y="581.607" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1er5t4gby3uze1)"> </text><text x="21.037" y="581.607" fill="#000" font-size="11" textLength="67.23" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1er5t4gby3uze1)">The guard.</text><text x="88.267" y="581.607" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1er5t4gby3uze1)"> </text><text x="95.26" y="581.607" fill="#000" font-size="11" textLength="144.993" font-family="'Segoe UI, Helvetica, Arial'">The trigger locks THIS row</text><text x="17.54" y="594.412" fill="#000" font-size="11" textLength="258.425" font-family="'Segoe UI, Helvetica, Arial'">(FOR UPDATE) before touching the flag, so two</text><text x="17.54" y="607.217" fill="#000" font-size="11" textLength="279.275" font-family="'Segoe UI, Helvetica, Arial'">concurrent inserts for the same donor cannot both</text><text x="17.54" y="620.021" fill="#000" font-size="11" textLength="320.633" font-family="'Segoe UI, Helvetica, Arial'">conclude "I am the newest". d21_recency_flag_unguarded</text><text x="17.54" y="632.826" fill="#000" font-size="11" textLength="273.125" font-family="'Segoe UI, Helvetica, Arial'">is this exact design with that lock removed — the</text><text x="17.54" y="645.631" fill="#000" font-size="11" textLength="264.403" font-family="'Segoe UI, Helvetica, Arial'">negative control, expected to leave two flagged</text><text x="17.54" y="658.435" fill="#000" font-size="11" textLength="275.408" font-family="'Segoe UI, Helvetica, Arial'">donations for one donor under concurrent inserts.</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="60"><path d="M299.15,417.967 L299.15,491.99 A0,0 0 0 0 299.15,491.99 L647.556,491.99 A0,0 0 0 0 647.556,491.99 L647.556,427.967 L637.556,417.967 L362.24,417.967 L358.24,343.807 L354.24,417.967 L299.15,417.967 A0,0 0 0 0 299.15,417.967" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M637.556,417.967 L637.556,427.967 L647.556,427.967 L637.556,417.967" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="305.15" y="433.177" fill="#000" font-size="11" textLength="230.731" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">The asymmetry, again (compare D4).</text><text x="539.378" y="433.177" fill="#000" font-size="11" textLength="93.178" font-family="'Segoe UI, Helvetica, Arial'">INSERT can push</text><text x="305.15" y="445.982" fill="#000" font-size="11" textLength="281.467" font-family="'Segoe UI, Helvetica, Arial'">the flag forward for free (a new donation is trivially</text><text x="305.15" y="458.787" fill="#000" font-size="11" textLength="307.296" font-family="'Segoe UI, Helvetica, Arial'">newer than nothing). DELETE cannot: if the deleted row</text><text x="305.15" y="471.591" fill="#000" font-size="11" textLength="304.423" font-family="'Segoe UI, Helvetica, Arial'">carried the flag, the donor's next-newest survivor must</text><text x="305.15" y="484.396" fill="#000" font-size="11" textLength="322.104" font-family="'Segoe UI, Helvetica, Arial'">be found and promoted — a MAX cannot be decremented.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="31" data-link-type="crowfoot"><path d="M121.43,142.517 C121.43,210.637 121.43,313.257 121.43,385.107" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="31"/><line x1="117.43" y1="138.517" x2="125.43" y2="138.517" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="117.43" y1="141.517" x2="125.43" y2="141.517" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="121.43" y1="142.517" x2="121.43" y2="134.517" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="121.43" y1="395.107" x2="127.43" y2="403.107" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="121.43" y1="395.107" x2="115.43" y2="403.107" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="121.43" y1="395.107" x2="121.43" y2="403.107" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="121.43" cy="389.107" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="32" data-link-type="crowfoot"><path d="M222.63,395.157 C222.63,376.777 222.63,381.697 222.63,361.777" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="32"/><line x1="226.63" y1="399.157" x2="218.63" y2="399.157" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="226.63" y1="396.157" x2="218.63" y2="396.157" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="222.63" y1="395.1