="32"><path d="M80.767,531.177 L80.767,711.638 A0,0 0 0 0 80.767,711.638 L448.664,711.638 A0,0 0 0 0 448.664,711.638 L448.664,541.177 L438.664,531.177 L268.717,531.177 L264.717,471.237 L260.717,531.177 L80.767,531.177 A0,0 0 0 0 80.767,531.177" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M438.664,531.177 L438.664,541.177 L448.664,541.177 L438.664,531.177" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="86.767" y="546.387" fill="#000" font-size="11" textLength="74.406" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">No triggers.</text><text x="164.669" y="546.387" fill="#000" font-size="11" textLength="169.7" font-family="'Segoe UI, Helvetica, Arial'">The client runs the same three</text><text x="86.767" y="559.192" fill="#000" font-size="11" textLength="288.433" font-family="'Segoe UI, Helvetica, Arial'">statements inside one transaction, which makes the</text><text x="86.767" y="571.997" fill="#000" font-size="11" textLength="250.18" font-family="'Segoe UI, Helvetica, Arial'">concurrency control a parameter instead of a</text><text x="86.767" y="584.801" fill="#000" font-size="11" textLength="133.155" font-family="'Segoe UI, Helvetica, Arial'">property of the schema:</text><text x="86.767" y="597.606" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="90.596" y="612.411" fill="#000" font-size="11" textLength="52.417" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">strategy</text><text x="151.59" y="612.411" fill="#000" font-size="11" textLength="188.262" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">how the parent row is claimed</text><text x="90.263" y="625.215" fill="#000" font-size="11" textLength="27.049" font-family="'Segoe UI, Helvetica, Arial'">blind</text><text x="151.257" y="625.215" fill="#000" font-size="11" textLength="244.954" font-family="'Segoe UI, Helvetica, Arial'">plain UPDATE; the engine's row lock decides</text><text x="90.263" y="638.02" fill="#000" font-size="11" textLength="53.883" font-family="'Segoe UI, Helvetica, Arial'">forupdate</text><text x="151.257" y="638.02" fill="#000" font-size="11" textLength="227.627" font-family="'Segoe UI, Helvetica, Arial'">SELECT ... FOR UPDATE first (pessimistic)</text><text x="90.263" y="650.825" fill="#000" font-size="11" textLength="54.001" font-family="'Segoe UI, Helvetica, Arial'">optimistic</text><text x="151.257" y="650.825" fill="#000" font-size="11" textLength="278.91" font-family="'Segoe UI, Helvetica, Arial'">read version, UPDATE ... WHERE version = n, retry</text><line x1="86.767" y1="602.2" x2="433.664" y2="602.2" style="stroke:#000;stroke-width:0.5;"/><line x1="86.767" y1="615.005" x2="433.664" y2="615.005" style="stroke:#000;stroke-width:0.5;"/><line x1="86.767" y1="627.81" x2="433.664" y2="627.81" style="stroke:#000;stroke-width:0.5;"/><line x1="86.767" y1="640.614" x2="433.664" y2="640.614" style="stroke:#000;stroke-width:0.5;"/><line x1="86.767" y1="653.419" x2="433.664" y2="653.419" style="stroke:#000;stroke-width:0.5;"/><line x1="86.767" y1="602.2" x2="86.767" y2="653.419" style="stroke:#000;stroke-width:0.5;"/><line x1="147.761" y1="602.2" x2="147.761" y2="653.419" style="stroke:#000;stroke-width:0.5;"/><line x1="433.664" y1="602.2" x2="433.664" y2="653.419" style="stroke:#000;stroke-width:0.5;"/><text x="86.767" y="665.63" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="86.767" y="678.434" fill="#000" font-size="11" textLength="279.254" font-family="'Segoe UI, Helvetica, Arial'">D4 and D5 read identically by construction, so any</text><text x="86.767" y="691.239" fill="#000" font-size="11" textLength="259.993" font-family="'Segoe UI, Helvetica, Arial'">measured read difference between them is the</text><text x="86.767" y="704.044" fill="#000" font-size="11" textLength="235.071" font-family="'Segoe UI, Helvetica, Arial'">harness's own noise floor — a free control.</text></g><!--link c to p--><g