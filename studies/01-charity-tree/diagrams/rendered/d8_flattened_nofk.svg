<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:533px;height:737px;background:#FFFFFF;" width="533px" height="737px" viewBox="0 0 533 737" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="bwxhetqjp649e0" x="0" y="0" width="1" height="1"><feFlood flood-color="#F5D0D0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="bwxhetqjp649e1" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFE0E0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="10" y="22.995" fill="#000" font-size="14" textLength="506.201" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">D8 — flattened-nofk  (D3 with referential integrity switched off)</text></g><!--class c--><g class="entity" data-qualified-name="c" id="ent0001" data-source-line="4"><rect x="173.735" y="44.297" width="176.728" height="64.414" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="173.735" y="44.297" width="176.728" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="173.735" y="64.602" width="176.728" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="173.735" y="44.297" width="176.728" height="64.414" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="243.018" y="59.507" fill="#000" font-size="11" textLength="38.162" font-family="'Segoe UI, Helvetica, Arial'">charity</text><line x1="174.735" y1="67.102" x2="349.463" y2="67.102" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="184.735" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="192.735" y="81.312" fill="#000" font-size="11" textLength="132.709" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «PK»</text><line x1="174.735" y1="87.906" x2="349.463" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="184.735" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="192.735" y="102.117" fill="#000" font-size="11" textLength="151.728" font-family="'Segoe UI, Helvetica, Arial'">name, country, founded_on</text></g><!--class p--><g class="entity" data-qualified-name="p" id="ent0002" data-source-line="9"><rect x="129.145" y="168.707" width="265.92" height="77.219" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="129.145" y="168.707" width="265.92" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="129.145" y="189.012" width="265.92" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="129.145" y="168.707" width="265.92" height="77.219" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="243.253" y="183.917" fill="#000" font-size="11" textLength="37.705" font-family="'Segoe UI, Helvetica, Arial'">person</text><line x1="130.145" y1="191.512" x2="394.065" y2="191.512" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="140.145" cy="203.414" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="148.145" y="205.722" fill="#000" font-size="11" textLength="132.252" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «PK»</text><line x1="130.145" y1="212.316" x2="394.065" y2="212.316" style="stroke:#5A6B7D;stroke-width:1;"/><text x="148.145" y="226.527" fill="#000" font-size="11" textLength="240.92" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bwxhetqjp649e0)">* charity_id : BIGINT  — plain column, no FK</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="140.145" cy="237.023" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="148.145" y="239.331" fill="#000" font-size="11" textLength="148.092" font-family="'Segoe UI, Helvetica, Arial'">full_name, email, joined_at</text></g><!--class d--><g class="entity" data-qualified-name="d" id="ent0003" data-source-line="15"><rect x="129.145" y="305.927" width="265.92" height="90.023" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="129.145" y="305.927" width="265.92" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="129.145" y="326.232" width="265.92" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="129.145" y="305.927" width="265.92" height="90.023" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="237.857" y="321.137" fill="#000" font-size="11" textLength="48.496" font-family="'Segoe UI, Helvetica, Arial'">donation</text><line x1="130.145" y1="328.732" x2="394.065" y2="328.732" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="140.145" cy="340.634" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="148.145" y="342.942" fill="#000" font-size="11" textLength="143.043" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT «PK»</text><line x1="130.145" y1="349.536" x2="394.065" y2="349.536" style="stroke:#5A6B7D;stroke-width:1;"/><text x="148.145" y="363.747" fill="#000" font-size="11" textLength="240.464" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bwxhetqjp649e0)">* person_id : BIGINT  — plain column, no FK</text><text x="148.145" y="376.551" fill="#000" font-size="11" textLength="240.92" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bwxhetqjp649e0)">* charity_id : BIGINT  — plain column, no FK</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="140.145" cy="387.048" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="148.145" y="389.356" fill="#000" font-size="11" textLength="233.938" font-family="'Segoe UI, Helvetica, Arial'">amount_cents, currency, donated_at, note</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="26"><path d="M89.595,455.957 L89.595,722.051 A0,0 0 0 0 89.595,722.051 L434.606,722.051 A0,0 0 0 0 434.606,722.051 L434.606,465.957 L424.606,455.957 L266.105,455.957 L262.105,396.277 L258.105,455.957 L89.595,455.957 A0,0 0 0 0 89.595,455.957" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M424.606,455.957 L424.606,465.957 L434.606,465.957 L424.606,455.957" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="95.595" y="471.167" fill="#000" font-size="11" textLength="237.343" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">Identical to D3 in every other respect:</text><text x="336.435" y="471.167" fill="#000" font-size="11" textLength="83.171" font-family="'Segoe UI, Helvetica, Arial'">same columns,</text><text x="95.595" y="483.972" fill="#000" font-size="11" textLength="318.64" font-family="'Segoe UI, Helvetica, Arial'">same five indexes, same queries, same write statements.</text><text x="95.595" y="496.777" fill="#000" font-size="11" textLength="277.32" font-family="'Segoe UI, Helvetica, Arial'">The D3/D8 pair isolates one variable — the cost of</text><text x="95.595" y="509.581" fill="#000" font-size="11" textLength="166.262" font-family="'Segoe UI, Helvetica, Arial'">enforcing referential integrity.</text><text x="95.595" y="522.386" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="95.595" y="535.191" fill="#000" font-size="11" textLength="262.147" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">What a foreign key does on every INSERT:</text><text x="99.092" y="547.995" fill="#000" font-size="11" textLength="180.619" font-family="'Segoe UI, Helvetica, Arial'">1. look up the parent person row</text><text x="99.092" y="560.8" fill="#000" font-size="11" textLength="181.076" font-family="'Segoe UI, Helvetica, Arial'">2. look up the parent charity row</text><text x="99.092" y="573.605" fill="#000" font-size="11" textLength="276.977" font-family="'Segoe UI, Helvetica, Arial'">3. take a KEY SHARE lock on each, held to commit</text><text x="95.595" y="586.41" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="95.595" y="599.214" fill="#000" font-size="11" textLength="298.864" font-family="'Segoe UI, Helvetica, Arial'">So a "single-row insert" is three row accesses and two</text><text x="95.595" y="612.019" fill="#000" font-size="11" textLength="288.6" font-family="'Segoe UI, Helvetica, Arial'">shared locks — on rows other concurrent inserts are</text><text x="95.595" y="624.824" fill="#000" font-size="11" textLength="317.77" font-family="'Segoe UI, Helvetica, Arial'">touching too. On PostgreSQL those are local buffer reads.</text><text x="95.595" y="637.628" fill="#000" font-size="11" textLength="296.979" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bwxhetqjp649e1)">On YugabyteDB the parent may live on another node,</text><text x="95.595" y="650.433" fill="#000" font-size="11" textLength="251.818" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bwxhetqjp649e1)">so each check can become a cross-node RPC.</text><text x="95.595" y="663.238" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="95.595" y="676.042" fill="#000" font-size="11" textLength="113.072" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">What you give up:</text><text x="212.164" y="676.042" fill="#000" font-size="11" textLength="204.848" font-family="'Segoe UI, Helvetica, Arial'">nothing prevents a donation pointing</text><text x="95.595" y="688.847" fill="#000" font-size="11" textLength="279.077" font-family="'Segoe UI, Helvetica, Arial'">at a person who does not exist, and nothing keeps</text><text x="95.595" y="701.652" fill="#000" font-size="11" textLength="286.709" font-family="'Segoe UI, Helvetica, Arial'">donation.charity_id agreeing with person.charity_id.</text><text x="95.595" y="714.456" fill="#000" font-size="11" textLength="225.436" font-family="'Segoe UI, Helvetica, Arial'">The numbers say what that risk is worth.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="22" data-link-type="crowfoot"><path d="M262.105,109.177 C262.105,127.187 262.105,131.657 262.105,150.557" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="c-to-p" codeLine="22"/><line x1="262.105" y1="160.557" x2="268.105" y2="168.557" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.105" y1="160.557" x2="256.105" y2="168.557" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.105" y1="160.557" x2="262.105" y2="168.557" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="262.105" cy="154.557" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/><text x="166.105" y="136.006" fill="#5A6B7D" font-size="12" textLength="95.818" font-family="'Segoe UI, Helvetica, Arial'">convention only</text></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="23" data-link-type="crowfoot"><path d="M262.105,246.187 C262.105,264.547 262.105,268.577 262.105,287.677" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="p-to-d" codeLine="23"/><line x1="262.105" y1="297.677" x2="268.105" y2="305.677" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.105" y1="297.677" x2="256.105" y2="305.677" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.105" y1="297.677" x2="262.105" y2="305.677" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="262.105" cy="291.677" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/><text x="166.105" y="273.076" fill="#5A6B7D" font-size="12" textLen