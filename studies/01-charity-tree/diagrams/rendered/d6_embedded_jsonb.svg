<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:612px;height:686px;background:#FFFFFF;" width="612px" height="686px" viewBox="0 0 612 686" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="b34sg75c9ovwj0" x="0" y="0" width="1" height="1"><feFlood flood-color="#E7DDF5" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="59.646" y="22.995" fill="#000" font-size="14" textLength="486.575" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">D6 — embedded-jsonb  (the child table folded into its parent)</text></g><!--class c--><g class="entity" data-qualified-name="c" id="ent0001" data-source-line="4"><rect x="100.69" y="44.297" width="157.709" height="90.023" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="100.69" y="44.297" width="157.709" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="100.69" y="64.602" width="157.709" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="100.69" y="44.297" width="157.709" height="90.023" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="160.464" y="59.507" fill="#000" font-size="11" textLength="38.162" font-family="'Segoe UI, Helvetica, Arial'">charity</text><line x1="101.69" y1="67.102" x2="257.399" y2="67.102" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.69" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.69" y="81.312" fill="#000" font-size="11" textLength="132.709" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «PK»</text><line x1="101.69" y1="87.906" x2="257.399" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.69" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.69" y="102.117" fill="#000" font-size="11" textLength="69.819" font-family="'Segoe UI, Helvetica, Arial'">name : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.69" cy="112.613" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.69" y="114.921" fill="#000" font-size="11" textLength="80.69" font-family="'Segoe UI, Helvetica, Arial'">country : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="111.69" cy="125.418" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="119.69" y="127.726" fill="#000" font-size="11" textLength="104.844" font-family="'Segoe UI, Helvetica, Arial'">founded_on : DATE</text></g><!--class p--><g class="entity" data-qualified-name="p" id="ent0002" data-source-line="11"><rect x="50.99" y="239.947" width="257.11" height="123.633" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="50.99" y="239.947" width="257.11" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="50.99" y="260.252" width="257.11" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="50.99" y="239.947" width="257.11" height="123.633" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="160.692" y="255.157" fill="#000" font-size="11" textLength="37.705" font-family="'Segoe UI, Helvetica, Arial'">person</text><line x1="51.99" y1="262.752" x2="307.1" y2="262.752" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="61.99" cy="274.654" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="69.99" y="276.962" fill="#000" font-size="11" textLength="132.252" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «PK»</text><line x1="51.99" y1="283.556" x2="307.1" y2="283.556" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="61.99" cy="295.459" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="69.99" y="297.767" fill="#000" font-size="11" textLength="132.403" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="61.99" cy="308.263" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="69.99" y="310.571" fill="#000" font-size="11" textLength="92.275" font-family="'Segoe UI, Helvetica, Arial'">full_name : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="61.99" cy="321.068" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="69.99" y="323.376" fill="#000" font-size="11" textLength="68.959" font-family="'Segoe UI, Helvetica, Arial'">email : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="61.99" cy="333.873" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="69.99" y="336.181" fill="#000" font-size="11" textLength="138.827" font-family="'Segoe UI, Helvetica, Arial'">joined_at : TIMESTAMPTZ</text><line x1="51.99" y1="342.775" x2="307.1" y2="342.775" style="stroke:#5A6B7D;stroke-width:1;"/><text x="56.99" y="356.985" fill="#000" font-size="11" textLength="245.11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b34sg75c9ovwj0)">* donations : JSONB  — the whole child table</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="24"><path d="M343.22,194.317 L343.22,297.267 L308.45,301.267 L343.22,305.267 L343.22,409.192 A0,0 0 0 0 343.22,409.192 L597.868,409.192 A0,0 0 0 0 597.868,409.192 L597.868,204.317 L587.868,194.317 L343.22,194.317 A0,0 0 0 0 343.22,194.317" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M587.868,194.317 L587.868,204.317 L597.868,204.317 L587.868,194.317" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="349.22" y="209.527" fill="#000" font-size="11" textLength="128.364" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">array element shape</text><text x="349.22" y="222.332" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">{</text><text x="356.213" y="235.137" fill="#000" font-size="11" textLength="87.909" font-family="'Segoe UI, Helvetica, Arial'">"i": donation_id,</text><text x="356.213" y="247.941" fill="#000" font-size="11" textLength="105.333" font-family="'Segoe UI, Helvetica, Arial'">"a": amount_cents,</text><text x="356.213" y="260.746" fill="#000" font-size="11" textLength="75.228" font-family="'Segoe UI, Helvetica, Arial'">"c": currency,</text><text x="356.213" y="273.551" fill="#000" font-size="11" textLength="87.173" font-family="'Segoe UI, Helvetica, Arial'">"t": donated_at,</text><text x="356.213" y="286.355" fill="#000" font-size="11" textLength="49.076" font-family="'Segoe UI, Helvetica, Arial'">"n": note</text><text x="349.22" y="299.16" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'">}</text><text x="349.22" y="311.965" fill="#000" font-size="11" textLength="199.101" font-family="'Segoe UI, Helvetica, Arial'">Appended in chronological order, so</text><text x="349.22" y="324.77" fill="#000" font-size="11" textLength="209.419" font-family="'Segoe UI, Helvetica, Arial'">donations->0 is the first donation and</text><text x="349.22" y="337.574" fill="#000" font-size="11" textLength="178.541" font-family="'Segoe UI, Helvetica, Arial'">donations->-1 is the last — both</text><text x="349.22" y="350.379" fill="#000" font-size="11" textLength="191.259" font-family="'Segoe UI, Helvetica, Arial'">reachable with no unnesting at all.</text><text x="349.22" y="363.184" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="349.22" y="375.988" fill="#000" font-size="11" textLength="226.58" font-family="'Segoe UI, Helvetica, Arial'">Single-character keys on purpose: JSONB</text><text x="349.22" y="388.793" fill="#000" font-size="11" textLength="208.495" font-family="'Segoe UI, Helvetica, Arial'">stores every key of every element, so</text><text x="349.22" y="401.598" fill="#000" font-size="11" textLength="233.648" font-family="'Segoe UI, Helvetica, Arial'">key names multiply by the element count.</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="43"><path d="M6,469.197 L6,671.267 A0,0 0 0 0 6,671.267 L353.084,671.267 A0,0 0 0 0 353.084,671.267 L353.084,479.197 L343.084,469.197 L183.54,469.197 L179.54,364.027 L175.54,469.197 L6,469.197 A0,0 0 0 0 6,469.197" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M343.084,469.197 L343.084,479.197 L353.084,479.197 L343.084,469.197" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="484.407" fill="#000" font-size="11" textLength="128.879" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ person_charity_idx</text><text x="144.376" y="484.407" fill="#000" font-size="11" textLength="62.283" font-family="'Segoe UI, Helvetica, Arial'">(charity_id)</text><text x="12" y="497.212" fill="#000" font-size="11" textLength="147.866" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ person_donations_gin</text><text x="163.363" y="497.212" fill="#000" font-size="11" textLength="174.722" font-family="'Segoe UI, Helvetica, Arial'">GIN (donations jsonb_path_ops)</text><text x="12" y="510.017" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="522.821" fill="#000" font-size="11" textLength="226.354" font-family="'Segoe UI, Helvetica, Arial'">There is no donation table, so there is no</text><text x="12" y="535.626" fill="#000" font-size="11" textLength="215.102" font-family="'Segoe UI, Helvetica, Arial'">index on donated_at, on amount, or on</text><text x="12" y="548.431" fill="#000" font-size="11" textLength="202.313" font-family="'Segoe UI, Helvetica, Arial'">donation_id. A GIN index can answer</text><text x="12" y="561.235" fill="#000" font-size="11" textLength="236.511" font-family="'Segoe UI, Helvetica, Arial'">"which document contains this?" but it can</text><text x="12" y="574.04" fill="#000" font-size="11" textLength="261.631" font-family="'Segoe UI, Helvetica, Arial'">neither order nor aggregate across documents.</text><text x="12" y="586.845" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="599.65" fill="#000" font-size="11" textLength="260.471" font-family="'Segoe UI, Helvetica, Arial'">Wins: everything about ONE person is one row.</text><text x="12" y="612.454" fill="#000" font-size="11" textLength="262.066" font-family="'Segoe UI, Helvetica, Arial'">Loses: everything ACROSS persons unnests the</text><text x="12" y="625.259" fill="#000" font-size="11" textLength="229.668" font-family="'Segoe UI, Helvetica, Arial'">whole table; and appending one donation</text><text x="12" y="638.064" fill="#000" font-size="11" textLength="238.455" font-family="'Segoe UI, Helvetica, Arial'">rewrites the entire row, so under MVCC the</text><text x="12" y="650.868" fill="#000" font-size="11" textLength="215.349" font-family="'Segoe UI, Helvetica, Arial'">cost of a write grows with the history it</text><text x="12" y="663.673" fill="#000" font-size="11" textLength="67.756" font-family="'Segoe UI, Helvetica, Arial'">already has.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="21" data-link-type="crowfoot"><path d="M179.54,142.627 C179.54,173.217 179.54,187.977 179.54,221.587" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="21"/><line x1="175.54" y1="138.627" x2="183.54" y2="138.627" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="175.54" y1="141.627" x2="183.54" y2="141.627" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="179.54" y1="142.627" x