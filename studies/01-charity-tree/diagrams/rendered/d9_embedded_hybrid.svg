<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:595px;height:805px;background:#FFFFFF;" width="595px" height="805px" viewBox="0 0 595 805" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="b1tve9uq90qpja0" x="0" y="0" width="1" height="1"><feFlood flood-color="#E7DDF5" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b1tve9uq90qpja1" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3CD" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b1tve9uq90qpja2" x="0" y="0" width="1" height="1"><feFlood flood-color="#D8F0DE" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="32.173" y="22.995" fill="#000" font-size="14" textLength="524.214" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">D9 — embedded-hybrid  (embed a BOUNDED slice, keep the table)</text></g><!--class c--><g class="entity" data-qualified-name="c" id="ent0001" data-source-line="4"><rect x="67.79" y="44.297" width="176.728" height="64.414" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="67.79" y="44.297" width="176.728" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="67.79" y="64.602" width="176.728" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="67.79" y="44.297" width="176.728" height="64.414" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="137.073" y="59.507" fill="#000" font-size="11" textLength="38.162" font-family="'Segoe UI, Helvetica, Arial'">charity</text><line x1="68.79" y1="67.102" x2="243.518" y2="67.102" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="78.79" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="86.79" y="81.312" fill="#000" font-size="11" textLength="132.709" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «PK»</text><line x1="68.79" y1="87.906" x2="243.518" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="78.79" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="86.79" y="102.117" fill="#000" font-size="11" textLength="151.728" font-family="'Segoe UI, Helvetica, Arial'">name, country, founded_on</text></g><!--class p--><g class="entity" data-qualified-name="p" id="ent0002" data-source-line="9"><rect x="59.63" y="169.517" width="193.033" height="123.633" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="59.63" y="169.517" width="193.033" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="59.63" y="189.822" width="193.033" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="59.63" y="169.517" width="193.033" height="123.633" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="137.294" y="184.727" fill="#000" font-size="11" textLength="37.705" font-family="'Segoe UI, Helvetica, Arial'">person</text><line x1="60.63" y1="192.322" x2="251.663" y2="192.322" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="70.63" cy="204.224" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="78.63" y="206.532" fill="#000" font-size="11" textLength="132.252" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «PK»</text><line x1="60.63" y1="213.126" x2="251.663" y2="213.126" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="70.63" cy="225.029" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="78.63" y="227.337" fill="#000" font-size="11" textLength="132.403" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="70.63" cy="237.833" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="78.63" y="240.141" fill="#000" font-size="11" textLength="148.092" font-family="'Segoe UI, Helvetica, Arial'">full_name, email, joined_at</text><line x1="60.63" y1="246.736" x2="251.663" y2="246.736" style="stroke:#5A6B7D;stroke-width:1;"/><text x="65.63" y="260.946" fill="#000" font-size="11" textLength="149.472" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1tve9uq90qpja0)">* recent_donations : JSONB</text><text x="72.623" y="273.751" fill="#000" font-size="11" textLength="174.04" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1tve9uq90qpja0)">— the 20 newest, newest FIRST</text><text x="72.623" y="286.555" fill="#000" font-size="11" textLength="134.455" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1tve9uq90qpja0)">— a cache, not the truth</text></g><!--class d--><g class="entity" data-qualified-name="d" id="ent0003" data-source-line="19"><rect x="26.68" y="353.957" width="258.938" height="110.828" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="26.68" y="353.957" width="258.938" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="26.68" y="374.262" width="258.938" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="26.68" y="353.957" width="258.938" height="110.828" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="131.901" y="369.167" fill="#000" font-size="11" textLength="48.496" font-family="'Segoe UI, Helvetica, Arial'">donation</text><line x1="27.68" y1="376.762" x2="284.618" y2="376.762" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="37.68" cy="388.664" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="45.68" y="390.972" fill="#000" font-size="11" textLength="143.043" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT «PK»</text><line x1="27.68" y1="397.566" x2="284.618" y2="397.566" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="37.68" cy="409.469" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="45.68" y="411.777" fill="#000" font-size="11" textLength="131.946" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «FK»</text><text x="45.68" y="424.581" fill="#000" font-size="11" textLength="141.399" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1tve9uq90qpja1)">* charity_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="37.68" cy="435.078" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="45.68" y="437.386" fill="#000" font-size="11" textLength="233.938" font-family="'Segoe UI, Helvetica, Arial'">amount_cents, currency, donated_at, note</text><line x1="27.68" y1="443.98" x2="284.618" y2="443.98" style="stroke:#5A6B7D;stroke-width:1;"/><text x="32.68" y="458.191" fill="#000" font-size="11" textLength="203.709" font-style="italic" font-family="'Segoe UI, Helvetica, Arial'">still the source of truth, fully indexed</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="33"><path d="M287.75,168.717 L287.75,226.877 L252.99,230.877 L287.75,234.877 L287.75,293.959 A0,0 0 0 0 287.75,293.959 L580.56,293.959 A0,0 0 0 0 580.56,293.959 L580.56,178.717 L570.56,168.717 L287.75,168.717 A0,0 0 0 0 287.75,168.717" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M570.56,168.717 L570.56,178.717 L580.56,178.717 L570.56,168.717" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="293.75" y="183.927" fill="#000" font-size="11" textLength="202.549" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">q09 — "this donor's recent gifts"</text><text x="499.796" y="183.927" fill="#000" font-size="11" textLength="65.764" font-family="'Segoe UI, Helvetica, Arial'">is answered</text><text x="293.75" y="196.732" fill="#000" font-size="11" textLength="246.587" font-family="'Segoe UI, Helvetica, Arial'">from this one row: no second table, no index</text><text x="293.75" y="209.537" fill="#000" font-size="11" textLength="256.76" font-family="'Segoe UI, Helvetica, Arial'">descent, no sort. It is the highest-QPS query in</text><text x="293.75" y="222.341" fill="#000" font-size="11" textLength="219.468" font-family="'Segoe UI, Helvetica, Arial'">a system like this, so it is the one worth</text><text x="293.75" y="235.146" fill="#000" font-size="11" textLength="88.328" font-family="'Segoe UI, Helvetica, Arial'">buying outright.</text><text x="293.75" y="247.951" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="293.75" y="260.755" fill="#000" font-size="11" textLength="237.107" font-family="'Segoe UI, Helvetica, Arial'">Every OTHER question still goes to the real</text><text x="293.75" y="273.56" fill="#000" font-size="11" textLength="245.996" font-family="'Segoe UI, Helvetica, Arial'">donation table, so none of D6's cross-person</text><text x="293.75" y="286.365" fill="#000" font-size="11" textLength="119.947" font-family="'Segoe UI, Helvetica, Arial'">collapse applies here.</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="45"><path d="M6,524.787 L6,790.881 A0,0 0 0 0 6,790.881 L306.302,790.881 A0,0 0 0 0 306.302,790.881 L306.302,534.787 L296.302,524.787 L160.15,524.787 L156.15,465.127 L152.15,524.787 L6,524.787 A0,0 0 0 0 6,524.787" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M296.302,524.787 L296.302,534.787 L306.302,534.787 L296.302,524.787" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="539.997" fill="#000" font-size="11" textLength="162.631" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">The fix for what D6 broke.</text><text x="178.128" y="539.997" fill="#000" font-size="11" textLength="113.174" font-family="'Segoe UI, Helvetica, Arial'">In D6 the embedded</text><text x="12" y="552.802" fill="#000" font-size="11" textLength="264.494" font-family="'Segoe UI, Helvetica, Arial'">array is unbounded, so appending one donation</text><text x="12" y="565.607" fill="#000" font-size="11" textLength="268.775" font-family="'Segoe UI, Helvetica, Arial'">rewrites a document that grows with the donor's</text><text x="12" y="578.411" fill="#000" font-size="11" textLength="220.172" font-family="'Segoe UI, Helvetica, Arial'">whole history — write cost is O(history).</text><text x="12" y="591.216" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="604.021" fill="#000" font-size="11" textLength="264.467" font-family="'Segoe UI, Helvetica, Arial'">Here the array is capped at 20, so the rewrite is</text><text x="12" y="616.825" fill="#000" font-size="11" textLength="58.056" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1tve9uq90qpja2)">a constant</text><text x="70.056" y="616.825" fill="#000" font-size="11" textLength="201.883" font-family="'Segoe UI, Helvetica, Arial'">, no matter how much the donor has</text><text x="12" y="629.63" fill="#000" font-size="11" textLength="72.923" font-family="'Segoe UI, Helvetica, Arial'">given before.</text><text x="12" y="642.435" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="655.24" fill="#000" font-size="11" textLength="81.764" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">What it costs</text><text x="15.497" y="668.044" fill="#000" font-size="11" textLength="244.825" font-family="'Segoe UI, Helvetica, Arial'">* a second copy of recent data that can drift</text><text x="15.497" y="680.849" fill="#000" font-size="11" textLength="176.295" font-family="'Segoe UI, Helvetica, Arial'">* a trigger on the hot write path</text><text x="15.497" y="693.654" fill="#000" font-size="11" textLength="255.417" font-family="'Segoe UI, Helvetica, Arial'">* the cache size is now a design constant. The</text><text x="22.49" y="706.458" fill="#000" font-size="11" textLength="250.519" font-family="'Segoe UI, Helvetica, Arial'">catalogue asks for exactly 20; a query asking</text><text x="22.49" y="719.263" fill="#000" font-size="11" textLength="241.296" font-family="'Segoe UI, Helvetica, Arial'">for 21 falls off the cache entirely and has to</text><text x="22.49" y="732.068" fill="#000" font-size="11" textLength="114.292" font-family="'Segoe UI, Helvetica, Arial'">go back to the table.</text><text x="15.497" y="744.872" fill="#000" font-size="11" textLength="236.414" font-family="'Segoe UI, Helvetica, Arial'">* backdated inserts land at the front of the</text><text x="22.49" y="757.677" fill="#000" font-size="11" textLength="245.266" font-family="'Segoe UI, Helvetica, Arial'">cache where they do not belong — the table</text><text x="22.49" y="770.482" fill="#000" font-size="11" textLength="228.911" font-family="'Segoe UI, Helvetica, Arial'">underneath still has the truth, and such a</text><text x="22.49" y="783.286" fill="#000" font-size="11" textLength="236.634" font-family="'Segoe UI, Helvetica, Arial'">system would rebuild rather than prepend.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="28" data-link-type="crowfoot"><path d="M156.15,116.967 C156.15,134.427 156.15,130.577 156.15,151.207" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="28"/><line x1="152.15" y1="112.967" x2="160.15" y2="112.967" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="152.15" y1="115.967" x2="160.15" y2="115.967" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="156.15" y1="116.967" x2="156.15" y2="108.967" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="156.15" y1="161.207" x2="162.15" y2="169.207" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="156.15" y1="161.207" x2="150.15" y2="169.207" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="156.15" y1="161.207" x2="156.15" y2="169.207" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="156.15" cy="155.207" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="29" data-link-type="crowfoot"><path d="M123.98,301.607 C123.98,321.157 123.98,316.607 123.98,335.677" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="29"/><line x1="119.98" y1="297.607" x2="127.98" y2="297.607" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="119.98" y1="300.607" x2="127.98" y2="300.607" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="123.98" y1="301.607" x2="123.98" y2="293.607" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="123.98" y1="345.677" x2="129.98" y2="353.677" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="123.98" y1="345.677" x2="117.98" y2="353.677" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="123.98" y1="345.677" x2="123.98" y2="353.677" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="123.98" cy="339.677" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link d to p--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk6" data-source-line="30" data-link-type="dependency"><path d="M188.32,353.527 C188.32,334.457 188.32,318.017 188.32,298.477" style="stroke:#B03A2E;stroke-width:2;" fill="none" id="d-to-p" codeLine="30"/><polygon points="188.32,293.477,184.32,302.477,188.32,298.477,192.32,302.477,188.32,293.477" fill="#B03A2E" style="stroke:#B03A2E;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="44.439" y="306.646" fill="#5A6B7D" font-size="12" textLength="129.896" font-family="'Segoe UI, Helvetica, Arial'">AFTER INSERT trigger</text><text x="31.32" y="320.614" fill="#5A6B7D" font-size="12" textLength="156.135" font-family="'Segoe UI, Helvetica, Arial'">prepends, truncates at 20</text></g><?plantuml-src VLJHRXit47pNLsoLXoO7INOTD6rTLq1SIObQm4vj5Nre2u7YKJfM57aXUJchIO5-HB-mNz9PyiuEqC1FbdcxixEpi_kPjj8qfQ9rY4UZ9dLpC8Eeer4q-uR-_ViVKeUDAajLZglZnkkIw6bw8K6NrpzVpUOp2aPBDQAzKZN5Ib4K6wEU3GRA0kX8Gra9Znz34e4alHyG5TIzhG5uJfVBLykh5LrSlFbnEiNdyJZ5M740h7IDZVuueYr-WCVQsS5VzzYryi7P15rtqFdfKUHFLr_ac8AsZJ7hN5qTX3OZ-iDfYz8YzXWN6o7tvq_cNyrcYo-d1NabGMbTEYkYTZO0zuVRwwlBYnCEdFulWvAshDRPALdLgX17tLzQB6zkLuyd2f92Lk1dNSoQ-oPMVSw3F3sV953P2TG_FYhH9rNi5EeOBHQBvz_Ffe_9-T15GUB0aropJW5ZRRnNLcAkYKuIDxMZUWud9o5gOr9xmJLUAdBRtEWeZUX86eQuK-N92LgMzE73UEpUKpse-v_beAJnhqykJv-_F9kFOgNbtgeGlZlxVJo5Nyvf-7Ancj_GykfsVhC2jjxjbF_DrbxLofQWYN9MWbuW4J6guM3050c1LMGwDRTMl3tDkp94YS0DEVzvw3n1ExsDOLWKX4_2XbPvLI9hwzs1Khop07JjERgdeAIpPLuXbYEtYF1I1KPBRy7vEA5bP4HMfm8R66VyqvjRUjiepy8WHL0uXgWEPFHUfL8Zf9A-p-F2BR0g16-QexOxSarClKq6U9k_OwphrMj81Dp0fg4yb9s39D4b6A-4OOQThNhoA6Mv0bIQlO0SqhiGnjbN29VE6547HQAkZGPQ1M4cS6wPNP25thWOeHCmogJq2lMs-Wx7m5DROIQp5xJnRgyc47Xf-L-cr1yjLi5xSUIE6xl95oHHGrMKIYs3OyyTyLwrC3CF7A-oEV088rVQOKQ1MXshLAARCZBQoXaUGeWESh4F4W8w34dgwwVTjsT9rTVeCo7SCvDCfimEI-IogXb5XuUDctszE9tDfzX-d9WeREpsAxdY869KdYhNqg6H7v6aIZ36JhzJbZOAqgb4f2X-uRxW1sOQYW9llAUz2QMhZwnyv-DIH96LaC9IwM7hFg5R7EBXinznb3BvMYHp8OZVqysYeF_aha2vPOrLq3jxtz24C67EW45GpxXT0w72FgI9gpiX8_R-xFHRf6QhuoEcc5CuvkmBsWfZi5RRxKTL-I9wXLo1pY08p9jpTevOmzxCoRoJp9dVIxvDsAUWV0naE5laaui5jka6n0V6NAcjkW4V8Nywq1jb78pMN_nK8cUm7xrLKAdRgyIil-UZH3RmC4MExnQwTOqfCPTDe_alqY4-HcEfkrmFU_GV?></g></svg>