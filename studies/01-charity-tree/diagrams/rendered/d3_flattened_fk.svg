.496" font-family="'Segoe UI, Helvetica, Arial'">donation</text><line x1="165.377" y1="379.952" x2="422.793" y2="379.952" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="175.377" cy="391.854" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="183.377" y="394.162" fill="#000" font-size="11" textLength="143.043" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT «PK»</text><line x1="165.377" y1="400.756" x2="422.793" y2="400.756" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="175.377" cy="412.659" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="183.377" y="414.967" fill="#000" font-size="11" textLength="131.946" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «FK»</text><text x="183.377" y="427.771" fill="#000" font-size="11" textLength="234.416" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b14skqag28g0sg0)">* charity_id : BIGINT «FK» — denormalised</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="175.377" cy="438.268" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="183.377" y="440.576" fill="#000" font-size="11" textLength="125.979" font-family="'Segoe UI, Helvetica, Arial'">amount_cents : BIGINT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="175.377" cy="451.073" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="183.377" y="453.381" fill="#000" font-size="11" textLength="105.762" font-family="'Segoe UI, Helvetica, Arial'">currency : CHAR(3)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="175.377" cy="463.877" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="183.377" y="466.185" fill="#000" font-size="11" textLength="150.75" font-family="'Segoe UI, Helvetica, Arial'">donated_at : TIMESTAMPTZ</text><text x="183.377" y="478.99" fill="#000" font-size="11" textLength="63.406" font-family="'Segoe UI, Helvetica, Arial'">note : TEXT</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M82.567,545.587 L82.567,837.29 A0,0 0 0 0 82.567,837.29 L505.598,837.29 A0,0 0 0 0 505.598,837.29 L505.598,555.587 L495.598,545.587 L298.087,545.587 L294.087,486.057 L290.087,545.587 L82.567,545.587 A0,0 0 0 0 82.567,545.587" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M495.598,545.587 L495.598,555.587 L505.598,555.587 L495.598,545.587" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="88.567" y="560.797" fill="#000" font-size="11" textLength="121.478" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">all D2 indexes, plus</text><text x="88.567" y="573.602" fill="#000" font-size="11" textLength="174.738" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_charity_time_idx</text><text x="266.801" y="573.602" fill="#000" font-size="11" textLength="164.898" font-family="'Segoe UI, Helvetica, Arial'">(charity_id, donated_at DESC)</text><text x="88.567" y="586.407" fill="#000" font-size="11" textLength="194.149" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_charity_amount_idx</text><text x="286.212" y="586.407" fill="#000" font-size="11" textLength="204.386" font-family="'Segoe UI, Helvetica, Arial'">(charity_id) INCLUDE (amount_cents)</text><text x="88.567" y="599.211" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="88.567" y="612.016" fill="#000" font-size="11" textLength="270.526" font-family="'Segoe UI, Helvetica, Arial'">charity_id on donation is pure redundancy — it is</text><text x="88.567" y="624.821" fill="#000" font-size="11" textLength="279.275" font-family="'Segoe UI, Helvetica, Arial'">always equal to the donation's person's charity_id.</text><text x="88.567" y="637.625" fill="#000" font-size="11" textLength="163.378" font-family="'Segoe UI, Helvetica, Arial'">Buying with that redundancy:</text><text x="92.063" y="650.43" fill="#000" font-size="11" textLength="267.771" font-family="'Segoe UI, Helvetica, Arial'">* three of the current sixteen queries drop a join</text><text x="99.056" y="663.235" fill="#000" font-size="11" textLength="270.784" font-family="'Segoe UI, Helvetica, Arial'">(q02, q08, q15 in sql/d3_flattened_fk/queries.sql)</text><text x="92.063" y="676.04" fill="#000" font-size="11" textLength="268.861" font-family="'Segoe UI, Helvetica, Arial'">* q08 can be answered by an index-only scan on</text><text x="99.056" y="688.844" fill="#000" font-size="11" textLength="292.145" font-family="'Segoe UI, Helvetica, Arial'">donation_charity_amount_idx. Zero heap fetches is a</text><text x="99.056" y="701.649" fill="#000" font-size="11" textLength="287.074" font-family="'Segoe UI, Helvetica, Arial'">PREPARED-READ result, not a property of the index:</text><text x="99.056" y="714.454" fill="#000" font-size="11" textLength="304.992" font-family="'Segoe UI, Helvetica, Arial'">in run 20260913T125342Z-v3 the covering plan visited</text><text x="99.056" y="727.258" fill="#000" font-size="11" textLength="282.6" font-family="'Segoe UI, Helvetica, Arial'">1,756 / 31,293 entries with 0 fetches under explicit</text><text x="99.056" y="740.063" fill="#000" font-size="11" textLength="264.924" font-family="'Segoe UI, Helvetica, Arial'">VACUUM, while its ANALYZE-only diagnostic still</text><text x="99.056" y="752.868" fill="#000" font-size="11" textLength="196.249" font-family="'Segoe UI, Helvetica, Arial'">started at 31,293 fetches on trial 1.</text><text x="88.567" y="765.672" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="88.567" y="778.477" fill="#000" font-size="11" textLength="78.3" font-family="'Segoe UI, Helvetica, Arial'">Paying with it:</text><text x="92.063" y="791.282" fill="#000" font-size="11" textLength="244.396" font-family="'Segoe UI, Helvetica, Arial'">* a wider row and another index to maintain</text><text x="92.063" y="804.086" fill="#000" font-size="11" textLength="251.023" font-family="'Segoe UI, Helvetica, Arial'">* an invariant the database does not enforce.</text><text x="99.056" y="816.891" fill="#000" font-size="11" textLength="241.468" font-family="'Segoe UI, Helvetica, Arial'">Move a person between charities and every</text><text x="99.056" y="829.696" fill="#000" font-size="11" textLength="144.289" font-family="'Segoe UI, Helvetica, Arial'">donation row is now lying.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="29" data-link-type="crowfoot"><path d="M262.117,142.547 C262.117,161.137 262.117,156.767 262.117,175.977" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="29"/><line x1="258.117" y1="138.547" x2="266.117" y2="138.547" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="258.117" y1="141.547" x2="266.117" y2="141.547" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.117" y1="142.547" x2="262.117" y2="134.547" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.117" y1="185.977" x2="268.117" y2="193.977" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.117" y1="185.977" x2="256.117" y2="193.977" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.117" y1="185.977" x2="262.117" y2="193.977" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="262.117" cy="179.977" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="30" data-link-type="crowfoot"><path d="M236.687,305.477 C236.687,324.097 236.687,319.337 236.687,338.897" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="30"/><line x1="232.687" y1="301.477" x2="240.687" y2="301.477" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="232.687" y1="304.477" x2="240.687" y2="304.477" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="