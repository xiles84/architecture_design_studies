h="63.406" font-family="'Segoe UI, Helvetica, Arial'">note : TEXT</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="34"><path d="M82.567,545.577 L82.567,760.452 A0,0 0 0 0 82.567,760.452 L505.598,760.452 A0,0 0 0 0 505.598,760.452 L505.598,555.577 L495.598,545.577 L298.087,545.577 L294.087,485.897 L290.087,545.577 L82.567,545.577 A0,0 0 0 0 82.567,545.577" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M495.598,545.577 L495.598,555.577 L505.598,555.577 L495.598,545.577" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="88.567" y="560.787" fill="#000" font-size="11" textLength="121.478" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">all D2 indexes, plus</text><text x="88.567" y="573.592" fill="#000" font-size="11" textLength="174.738" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_charity_time_idx</text><text x="266.801" y="573.592" fill="#000" font-size="11" textLength="164.898" font-family="'Segoe UI, Helvetica, Arial'">(charity_id, donated_at DESC)</text><text x="88.567" y="586.397" fill="#000" font-size="11" textLength="194.149" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_charity_amount_idx</text><text x="286.212" y="586.397" fill="#000" font-size="11" textLength="204.386" font-family="'Segoe UI, Helvetica, Arial'">(charity_id) INCLUDE (amount_cents)</text><text x="88.567" y="599.201" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="88.567" y="612.006" fill="#000" font-size="11" textLength="270.526" font-family="'Segoe UI, Helvetica, Arial'">charity_id on donation is pure redundancy — it is</text><text x="88.567" y="624.811" fill="#000" font-size="11" textLength="279.275" font-family="'Segoe UI, Helvetica, Arial'">always equal to the donation's person's charity_id.</text><text x="88.567" y="637.615" fill="#000" font-size="11" textLength="163.378" font-family="'Segoe UI, Helvetica, Arial'">Buying with that redundancy:</text><text x="92.063" y="650.42" fill="#000" font-size="11" textLength="181.924" font-family="'Segoe UI, Helvetica, Arial'">* six of twelve queries lose a join</text><text x="92.063" y="663.225" fill="#000" font-size="11" textLength="230.135" font-family="'Segoe UI, Helvetica, Arial'">* "total donated to a charity" becomes an</text><text x="99.056" y="676.03" fill="#000" font-size="11" textLength="229.093" font-family="'Segoe UI, Helvetica, Arial'">index-only scan, never touching the heap</text><text x="88.567" y="688.834" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="88.567" y="701.639" fill="#000" font-size="11" textLength="78.3" font-family="'Segoe UI, Helvetica, Arial'">Paying with it:</text><text x="92.063" y="714.444" fill="#000" font-size="11" textLength="244.396" font-family="'Segoe UI, Helvetica, Arial'">* a wider row and another index to maintain</text><text x="92.063" y="727.248" fill="#000" font-size="11" textLength="251.023" font-family="'Segoe UI, Helvetica, Arial'">* an invariant the database does not enforce.</text><text x="99.056" y="740.053" fill="#000" font-size="11" textLength="241.468" font-family="'Segoe UI, Helvetica, Arial'">Move a person between charities and every</text><text x="99.056" y="752.858" fill="#000" font-size="11" textLength="144.289" font-family="'Segoe UI, Helvetica, Arial'">donation row is now lying.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="29" data-link-type="crowfoot"><path d="M262.117,142.547 C262.117,161.137 262.117,156.767 262.117,175.977" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="29"/><line x1="258.117" y1="138.547" x2="266.117" y2="138.547" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="258.117" y1="141.547" x2="266.117" y2="141.547" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="262.117" y1="142.547" x2="262.117" y2="134.547" style="stroke