roke-width:1;"/></g><text x="100.03" y="394.162" fill="#000" font-size="11" textLength="143.043" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT «PK»</text><line x1="82.03" y1="400.756" x2="255.78" y2="400.756" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.03" cy="412.659" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="100.03" y="414.967" fill="#000" font-size="11" textLength="131.946" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.03" cy="425.463" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="100.03" y="427.771" fill="#000" font-size="11" textLength="125.979" font-family="'Segoe UI, Helvetica, Arial'">amount_cents : BIGINT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.03" cy="438.268" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="100.03" y="440.576" fill="#000" font-size="11" textLength="105.762" font-family="'Segoe UI, Helvetica, Arial'">currency : CHAR(3)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="92.03" cy="451.073" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="100.03" y="453.381" fill="#000" font-size="11" textLength="150.75" font-family="'Segoe UI, Helvetica, Arial'">donated_at : TIMESTAMPTZ</text><text x="100.03" y="466.185" fill="#000" font-size="11" textLength="63.406" font-family="'Segoe UI, Helvetica, Arial'">note : TEXT</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="32"><path d="M6,532.777 L6,696.433 A0,0 0 0 0 6,696.433 L331.815,696.433 A0,0 0 0 0 331.815,696.433 L331.815,542.777 L321.815,532.777 L172.91,532.777 L168.91,473.247 L164.91,532.777 L6,532.777 A0,0 0 0 0 6,532.777" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M321.815,532.777 L321.815,542.777 L331.815,542.777 L321.815,532.777" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="12" y="547.987" fill="#000" font-size="11" textLength="304.815" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">Indexes: the two primary keys, and nothing else.</text><text x="12" y="560.792" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="573.597" fill="#000" font-size="11" textLength="232.987" font-family="'Segoe UI, Helvetica, Arial'">PostgreSQL does not index a foreign key's</text><text x="12" y="586.401" fill="#000" font-size="11" textLength="261.798" font-family="'Segoe UI, Helvetica, Arial'">referencing column for you. donation.person_id</text><text x="12" y="599.206" fill="#000" font-size="11" textLength="245.846" font-family="'Segoe UI, Helvetica, Arial'">is therefore unindexed, so navigating from a</text><text x="12" y="612.011" fill="#000" font-size="11" textLength="225.156" font-family="'Segoe UI, Helvetica, Arial'">person to their donations is a full scan of</text><text x="12" y="624.815" fill="#000" font-size="11" textLength="176.134" font-family="'Segoe UI, Helvetica, Arial'">every donation in the database.</text><text x="12" y="637.62" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="12" y="650.425" fill="#000" font-size="11" textLength="245.942" font-family="'Segoe UI, Helvetica, Arial'">This is the design you get by drawing the ER</text><text x="12" y="663.23" fill="#000" font-size="11" textLength="254.606" font-family="'Segoe UI, Helvetica, Arial'">diagram and stopping. It is in the study as the</text><text x="12" y="676.034" fill="#000" font-size="11" textLength="249.117" font-family="'Segoe UI, Helvetica, Arial'">honest floor, not as a strawman: it is a shape</text><text x="12" y="688.839" fill="#000" font-size="11" textLength="188.311" font-family="'Segoe UI, Helvetica, Arial'">that reaches production regularly.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="28" data-link-type="crowfoot"><path d="M168.91,142.557 C168.91,161.137 168.91,156.767 168.91,175.987" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="28"/><line x1="164.91" y1="138.557" x2="172.91" y2="138.557" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="164.91" y1="141.557" x2="172.91" y2="141.557" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="142.557" x2="168.91" y2="134.557" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="185.987" x2="174.91" y2="193.987" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="185.987" x2="162.91" y2="193.987" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="185.987" x2="168.91" y2="193.987" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="168.91" cy="179.987" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="29" data-link-type="crowfoot"><path d="M168.91,305.427 C168.91,324.187 168.91,319.507 168.91,338.787" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="29"/><line x1="164.91" y1="301.427" x2="172.91" y2="301.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="164.91" y1="304.427" x2="172.91" y2="304.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="305.427" x2="168.91" y2="297.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="348.787" x2="174.91" y2="356.787" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="348.787" x2="162.91" y2="356.787" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="168.91" y1="348.787" x2="168.91" y2="356.787" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="168.91" cy="342.787" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><?plantuml-src VLB1RjD04BtxAuPUW2YnXBX5LQL00qHG55eVAYxHn3kn5zQxrkwunRIL-X5y8L_IMTin4OfwisVVU_FUpBpGDZUD8jW4RWsbTLEPX3KRWlCtyFVn3rZ