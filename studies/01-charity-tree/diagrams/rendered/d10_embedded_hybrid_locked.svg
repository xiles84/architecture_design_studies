oke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="225.717" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="233.717" y="81.312" fill="#000" font-size="11" textLength="132.252" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «PK»</text><line x1="215.717" y1="87.906" x2="450.224" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="225.717" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="233.717" y="102.117" fill="#000" font-size="11" textLength="208.785" font-family="'Segoe UI, Helvetica, Arial'">charity_id, full_name, email, joined_at</text><line x1="215.717" y1="108.711" x2="450.224" y2="108.711" style="stroke:#5A6B7D;stroke-width:1;"/><text x="220.717" y="122.921" fill="#000" font-size="11" textLength="224.506" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bihezieid521a0)">* recent_donations : JSONB — newest 20</text></g><!--class d--><g class="entity" data-qualified-name="d" id="ent0002" data-source-line="11"><rect x="143.037" y="189.517" width="379.868" height="64.414" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="143.037" y="189.517" width="379.868" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="143.037" y="209.822" width="379.868" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="143.037" y="189.517" width="379.868" height="64.414" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="308.724" y="204.727" fill="#000" font-size="11" textLength="48.496" font-family="'Segoe UI, Helvetica, Arial'">donation</text><line x1="144.037" y1="212.322" x2="521.905" y2="212.322" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="154.037" cy="224.224" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="162.037" y="226.532" fill="#000" font-size="11" textLength="143.043" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT «PK»</text><line x1="144.037" y1="233.126" x2="521.905" y2="233.126" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="154.037" cy="245.029" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="162.037" y="247.337" fill="#000" font-size="11" textLength="56.74" font-family="'Segoe UI, Helvetica, Arial'">person_id,</text><text x="222.274" y="247.337" fill="#000" font-size="11" textLength="53.7" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bihezieid521a1)">charity_id</text><text x="275.974" y="247.337" fill="#000" font-size="11" textLength="240.931" font-family="'Segoe UI, Helvetica, Arial'">, amount_cents, currency, donated_at, note</text></g><g class="entity" data-qualified-name="GMN5" id="ent0006" data-source-line="20"><path d="M486.207,62.697 L486.207,82.607 L451.587,86.607 L486.207,90.607 L486.207,111.111 A0,0 0 0 0 486.207,111.111 L711.738,111.111 A0,0 0 0 0 711.738,111.111 L711.738,72.697 L701.738,62.697 L486.207,62.697 A0,0 0 0 0 486.207,62.697" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M701.738,62.697 L701.738,72.697 L711.738,72.697 L701.738,62.697" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="492.207" y="77.907" fill="#000" font-size="11" textLength="91.26" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">Identical to D9</text><text x="586.964" y="77.907" fill="#000" font-size="11" textLength="109.774" font-family="'Segoe UI, Helvetica, Arial'">in schema, indexes,</text><text x="492.207" y="90.712" fill="#000" font-size="11" textLength="165.5" font-family="'Segoe UI, Helvetica, Arial'">queries and write statements.</text><text x="492.207" y="103.517" fill="#000" font-size="11" textLength="132.634" font-family="'Segoe UI, Helvetica, Arial'">Only triggers.sql differs.</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="26"><path d="M46.607,313.927 L46.607,545.607 A0,0 0 0 0 46.607,545.607 L619.342,545.607 A0,0 0 0 0 619.342,545.607 L619.342,323.927 L609.342,313.927 L336.977,313.927 L332.977,254.227 L328.977,313.927 L46.607,313.927 A0,0 0 0 0 46.607,313.927" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M609.342,313.927 L609.342,323.927 L619.342,323.927 L609.342,313.927" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="52.607" y="329.137" fill="#000" font-size="11" textLength="302.683" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">D9's trigger corrupted 3-5 donor caches per 30 s</text><text x="52.607" y="341.942" fill="#000" font-size="11" textLength="272.427" font-family="'Segoe UI, Helvetica, Arial'">under concurrent reads and writes, while passing</text><text x="52.607" y="354.747" fill="#000" font-size="11" textLength="229.287" font-family="'Segoe UI, Helvetica, Arial'">every isolated audit. Two bugs, two fixes:</text><text x="52.607" y="367.551" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="56.437" y="382.356" fill="#000" font-size="11" textLength="23.579" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">bug</text><text x="137.54" y="382.356" fill="#000" font-size="11" textLength="57.331" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">symptom</text><text x="312.144" y="382.356" fill="#000" font-size="11" textLength="15.651" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">fix</text><text x="56.104" y="395.161" fill="#000" font-size="11" textLength="74.11" font-family="'Segoe UI, Helvetica, Arial'">ordering race</text><text x="137.207" y="395.161" fill="#000" font-size="11" textLength="119.566" font-family="'Segoe UI, Helvetica, Arial'">adjacent ids swapped</text><text x="308.314" y="395.161" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="311.811" y="395.161" fill="#000" font-size="11" textLength="181.403" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bihezieid521a2)">merge + sort by (donated_at, id)</text><text x="496.711" y="395.161" fill="#000" font-size="11" textLength="104.135" font-family="'Segoe UI, Helvetica, Arial'">instead of prepend</text><text x="56.104" y="407.965" fill="#000" font-size="11" textLength="62.084" font-family="'Segoe UI, Helvetica, Arial'">lost update</text><text x="137.207" y="407.965" fill="#000" font-size="11" textLength="167.61" font-family="'Segoe UI, Helvetica, Arial'">a committed donation missing</text><text x="308.314" y="407.965" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="311.811" y="407.965" fill="#000" font-size="11" textLength="137.376" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#bihezieid521a2)">lock person FOR UPDATE</text><text x="452.684" y="407.965" fill="#000" font-size="11" textLength="99.027" font-family="'Segoe UI, Helvetica, Arial'">before the rebuild</text><line x1="52.607" y1="372.146" x2="604.342" y2="372.146" style="stroke:#000;stroke-width:0.5;"/><line x1="52.607" y1="384.95" x2="604.342" y2="384.95" style="stroke:#000;stroke-width:0.5;"/><line x1="52.607" y1="397.755" x2="604.342" y2="397.755" style="stroke:#000;stroke-width:0.5;"/><line x1="52.607" y1="410.56" x2="604.342" y2="410.56" style="stroke:#000;stroke-width:0.5;"/><line x1="52.607" y1="372.146" x2="52.607" y2="410.56" style="stroke:#000;stroke-width:0.5;"/><line x1="133.711" y1="372.146" x2="133.711" y2="410.56" style="stroke:#000;stroke-width:0.5;"/><line x1="308.314" y1="372.146" x2="308.314" y2="410.56" style="stroke:#000;stroke-width:0.5;"/><line x1="604.342" y1="372.146" x2="604.342" y2="410.56" style="stroke:#000;stroke-width:0.5;"/><text x="52.607" y="422.77" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="52.607" y="435.575" fill="#000" font-size="11" textLength="259.198" font-family="'Segoe UI, Helvetica, Arial'">The lost update is the subtle one. The rebuild's</text><text x="52.607" y="448.38" fill="#000" font-size="11" textLength="292.22" font-family="'Segoe UI, Helvetica, Arial'">UPDATE waits on the row lock; PostgreSQL re-checks</text><text x="52.607" y="461.184" fill="#000" font-size="11" textLength="288.551" font-family="'Segoe UI, Helvetica, Arial'">the target row after the wait but does not re-run the</text><text x="52.607" y="473.989" fill="#000" font-size="11" textLength="268.179" font-family="'Segoe UI, Helvetica, Arial'">subquery against a fresh snapshot, so it writes a</text><text x="52.607" y="486.794" fill="#000" font-size="11" textLength="267.894" font-family="'Segoe UI, Helvetica, Arial'">cache missing the donation that just committed.</text><text x="52.607" y="499.598" fill="#000" font-size="11" textLength="257.324" font-family="'Segoe UI, Helvetica, Arial'">Locking in a separate statement first gives the</text><text x="52.607" y="512.403" fill="#000" font-size="11" textLength="306.142" font-family="'Segoe UI, Helvetica, Arial'">rebuild a snapshot taken after the competitor commits.</text><text x="52.607" y="525.208" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="52.607" y="538.012" fill="#000" font-size="11" textLength="215.51" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">D9 → D10 prices correctness itself.</text></g><!--link p to d--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="16" data-link-type="crowfoot"><path d="M293.557,137.927 C293.557,157.197 293.557,153.537 293.557,171.347" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="16"/><line x1="289.557" y1="133.927" x2="297.557" y2="133.927" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="289.557" y1="136.927" x2="297.557" y2="136.927" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="293.557" y1="137.927" x2="293.557" y2="1