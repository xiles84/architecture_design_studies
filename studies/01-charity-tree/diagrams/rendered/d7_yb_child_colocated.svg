t x="298.889" y="81.312" fill="#000" font-size="11" textLength="132.709" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «PK»</text><line x1="280.889" y1="87.906" x2="455.617" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="290.889" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="298.889" y="102.117" fill="#000" font-size="11" textLength="151.728" font-family="'Segoe UI, Helvetica, Arial'">name, country, founded_on</text></g><!--class p--><g class="entity" data-qualified-name="p" id="ent0002" data-source-line="9"><rect x="264.889" y="168.707" width="206.731" height="90.023" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="264.889" y="168.707" width="206.731" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="264.889" y="189.012" width="206.731" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="264.889" y="168.707" width="206.731" height="90.023" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="349.402" y="183.917" fill="#000" font-size="11" textLength="37.705" font-family="'Segoe UI, Helvetica, Arial'">person</text><line x1="265.889" y1="191.512" x2="470.62" y2="191.512" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="275.889" cy="203.414" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="283.889" y="205.722" fill="#000" font-size="11" textLength="101.449" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT</text><line x1="265.889" y1="212.316" x2="470.62" y2="212.316" style="stroke:#5A6B7D;stroke-width:1;"/><text x="283.889" y="226.527" fill="#000" font-size="11" textLength="181.731" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h0)">PRIMARY KEY ((person_id) HASH)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="275.889" cy="237.023" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="283.889" y="239.331" fill="#000" font-size="11" textLength="132.403" font-family="'Segoe UI, Helvetica, Arial'">charity_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="275.889" cy="249.828" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="283.889" y="252.136" fill="#000" font-size="11" textLength="148.092" font-family="'Segoe UI, Helvetica, Arial'">full_name, email, joined_at</text></g><!--class d--><g class="entity" data-qualified-name="d" id="ent0003" data-source-line="16"><rect x="273.299" y="318.737" width="189.903" height="149.242" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="273.299" y="318.737" width="189.903" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="273.299" y="339.042" width="189.903" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="273.299" y="318.737" width="189.903" height="149.242" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="344.003" y="333.947" fill="#000" font-size="11" textLength="48.496" font-family="'Segoe UI, Helvetica, Arial'">donation</text><line x1="274.299" y1="341.542" x2="462.203" y2="341.542" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="284.299" cy="353.444" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="292.299" y="355.752" fill="#000" font-size="11" textLength="112.24" font-family="'Segoe UI, Helvetica, Arial'">donation_id : BIGINT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="284.299" cy="366.249" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="292.299" y="368.557" fill="#000" font-size="11" textLength="131.946" font-family="'Segoe UI, Helvetica, Arial'">person_id : BIGINT «FK»</text><line x1="274.299" y1="375.151" x2="462.203" y2="375.151" style="stroke:#5A6B7D;stroke-width:1;"/><text x="279.299" y="389.361" fill="#000" font-size="11" textLength="81.066" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h0)">PRIMARY KEY (</text><text x="286.293" y="402.166" fill="#000" font-size="11" textLength="99.87" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h0)">(person_id) HASH,</text><text x="286.293" y="414.971" fill="#000" font-size="11" textLength="99.118" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h0)">donated_at DESC,</text><text x="286.293" y="427.775" fill="#000" font-size="11" textLength="97.507" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h0)">donation_id ASC )</text><line x1="274.299" y1="434.37" x2="462.203" y2="434.37" style="stroke:#5A6B7D;stroke-width:1;"/><text x="292.299" y="448.58" fill="#000" font-size="11" textLength="141.399" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btcqgvfzcpp2h1)">* charity_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="284.299" cy="459.077" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="292.299" y="461.385" fill="#000" font-size="11" textLength="164.903" font-family="'Segoe UI, Helvetica, Arial'">amount_cents, currency, note</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="32"><path d="M208.449,527.977 L208.449,845.289 A0,0 0 0 0 208.449,845.289 L528.055,845.289 A0,0 0 0 0 528.055,845.289 L528.055,537.977 L518.055,527.977 L372.249,527.977 L368.249,468.117 L364.249,527.977 L208.449,527.977 A0,0 0 0 0 208.449,527.977" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M518.055,527.977 L518.055,537.977 L528.055,537.977 L518.055,527.977" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="214.449" y="543.187" fill="#000" font-size="11" textLength="279.286" font-family="'Segoe UI, Helvetica, Arial'">YugabyteDB shards a table by hashing the leading</text><text x="214.449" y="555.992" fill="#000" font-size="11" textLength="178.922" font-family="'Segoe UI, Helvetica, Arial'">HASH column of its primary key.</text><text x="214.449" y="568.797" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="214.449" y="581.601" fill="#000" font-size="11" textLength="101.605" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">With the default</text><text x="319.551" y="581.601" fill="#000" font-size="11" textLength="185.308" font-family="'Segoe UI, Helvetica, Arial'">donation_id BIGINT PRIMARY KEY,</text><text x="214.449" y="594.406" fill="#000" font-size="11" textLength="267.427" font-family="'Segoe UI, Helvetica, Arial'">one person's 40 donations hash to ~40 different</text><text x="214.449" y="607.211" fill="#000" font-size="11" textLength="293.6" font-family="'Segoe UI, Helvetica, Arial'">tablets. "The last 20 donations of person X" becomes</text><text x="214.449" y="620.015" fill="#000" font-size="11" textLength="272.938" font-family="'Segoe UI, Helvetica, Arial'">a scatter-gather across every node in the cluster.</text><text x="214.449" y="632.82" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="214.449" y="645.625" fill="#000" font-size="11" textLength="29.552" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">Here</text><text x="244.001" y="645.625" fill="#000" font-size="11" textLength="197.844" font-family="'Segoe UI, Helvetica, Arial'">, person_id leads the key, so all of a</text><text x="214.449" y="658.43" fill="#000" font-size="11" textLength="275.838" font-family="'Segoe UI, Helvetica, Arial'">person's donations live in one tablet on one node,</text><text x="214.449" y="671.234" fill="#000" font-size="11" textLength="245.438" font-family="'Segoe UI, Helvetica, Arial'">already stored newest-first. The parent/child</text><text x="214.449" y="684.039" fill="#000" font-size="11" textLength="245.029" font-family="'Segoe UI, Helvetica, Arial'">locality of the tree survives into the physical</text><text x="214.449" y="696.844" fill="#000" font-size="11" textLength="37.818" font-family="'Segoe UI, Helvetica, Arial'">layout.</text><text x="214.449" y="709.648" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="214.449" y="722.453" fill="#000" font-size="11" textLength="56.907" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">The cost:</text><text x="274.853" y="722.453" fill="#000" font-size="11" textLength="200.138" font-family="'Segoe UI, Helvetica, Arial'">donation_id is no longer the primary</text><text x="214.449" y="735.258" fill="#000" font-size="11" textLength="161.622" font-family="'Segoe UI, Helvetica, Arial'">key, so identity lookups need</text><text x="214.449" y="748.062" fill="#000" font-size="11" textLength="109.533" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">+ donation_id_idx</text><text x="327.479" y="748.062" fill="#000" font-size="11" textLength="168.341" font-family="'Segoe UI, Helvetica, Arial'">UNIQUE (donation_id HASH) —</text><text x="214.449" y="760.867" fill="#000" font-size="11" textLength="263.055" font-family="'Segoe UI, Helvetica, Arial'">and in YugabyteDB a secondary index is itself a</text><text x="214.449" y="773.672" fill="#000" font-size="11" textLength="255.132" font-family="'Segoe UI, Helvetica, Arial'">distributed table, making that a two-hop read.</text><text x="214.449" y="786.476" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="214.449" y="799.281" fill="#000" font-size="11" textLength="298.606" font-family="'Segoe UI, Helvetica, Arial'">The same lever exists elsewhere: PARTITION BY HASH</text><text x="214.449" y="812.086" fill="#000" font-size="11" textLength="277.589" font-family="'Segoe UI, Helvetica, Arial'">with local indexes in PostgreSQL, the partition key</text><text x="214.449" y="824.89" fill="#000" font-size="11" textLength="228.954" font-family="'Segoe UI, Helvetica, Arial'">in Cassandra-family stores. It is a general</text><text x="214.449" y="837.695" fill="#000" font-size="11" textLength="253.312" font-family="'Segoe UI, Helvetica, Arial'">tree-design decision, not a YugabyteDB quirk.</text></g><!--link c to p--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-source-line="28" data-link-type="crowfoot"><path d="M368.249,117.017 C368.249,134.777 368.249,131.037 368.249,150.457" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="c-p" codeLine="28"/><line x1="364.249" y1="113.017" x2="372.249" y2="113.017" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="364.249" y1="116.017" x2="372.249" y2="116.017" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="117.017" x2="368.249" y2="109.017" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="160.457" x2="374.249" y2="168.457" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="160.457" x2="362.249" y2="168.457" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="160.457" x2="368.249" y2="168.457" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="368.249" cy="154.457" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link p to d--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="29" data-link-type="crowfoot"><path d="M368.249,267.047 C368.249,285.027 368.249,280.197 368.249,300.337" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="p-d" codeLine="29"/><line x1="364.249" y1="263.047" x2="372.249" y2="263.047" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="364.249" y1="266.047" x2="372.249" y2="266.047" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="267.047" x2="368.249" y2="259.047" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="368.249" y1="310.337" x2="374.249" y2="318.337" style="stroke:#5A6B7D;stroke-width:1;"/><line 