104.26" y1="329.852" x2="1074.656" y2="329.852" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="109.26" y="342.99" fill="#000" font-size="12" textLength="194.502" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[S1 — checked confirmation]</text><polygon points="738.783,364.789,728.783,368.789,738.783,372.789,734.783,368.789" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="732.783" y1="368.789" x2="1057.656" y2="368.789" style="stroke:#5A6B7D;stroke-width:1;"/><text x="744.783" y="363.959" fill="#5A6B7D" font-size="12" textLength="306.873" font-family="'Segoe UI, Helvetica, Arial'">minute 40.5: takes seats 3,4 (A's hold has expired)</text><polygon points="715.783,392.758,725.783,396.758,715.783,400.758,719.783,396.758" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="125.26" y1="396.758" x2="721.783" y2="396.758" style="stroke:#5A6B7D;stroke-width:1;"/><text x="132.26" y="391.928" fill="#5A6B7D" font-size="12" textLength="502.664" font-family="'Segoe UI, Helvetica, Arial'">minute 41: UPDATE … WHERE hold = A AND held AND expires_at > now() → 0 rows</text><polygon points="136.26,420.727,126.26,424.727,136.26,428.727,132.26,424.727" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="130.26" y1="424.727" x2="726.783" y2="424.727" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="142.26" y="419.896" fill="#5A6B7D" font-size="12" textLength="138.914" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">refused after paying</text><text x="281.174" y="419.896" fill="#5A6B7D" font-size="12" textLength="403.939" font-family="'Segoe UI, Helvetica, Arial'">: refund. No double sale — but the promise was broken at its edge.</text><line x1="104.26" y1="433.727" x2="1074.656" y2="433.727" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="109.26" y="446.865" fill="#000" font-size="12" textLength="327.416" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[K0 — naive confirmation (NEGATIVE CONTROL)]</text><polygon points="738.783,468.664,728.783,472.664,738.783,476.664,734.783,472.664" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="732.783" y1="472.664" x2="1057.656" y2="472.664" style="stroke:#5A6B7D;stroke-width:1;"/><text x="744.783" y="467.834" fill="#5A6B7D" font-size="12" textLength="172.014" font-family="'Segoe UI, Helvetica, Arial'">minute 40.5: takes seats 3,4</text><polygon points="715.783,496.633,725.783,500.633,715.783,504.633,719.783,500.633" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="125.26" y1="500.633" x2="721.783" y2="500.633" style="stroke:#5A6B7D;stroke-width:1;"/><text x="132.26" y="495.803" fill="#5A6B7D" font-size="12" textLength="342.352" font-family="'Segoe UI, Helvetica, Arial'">minute 41: UPDATE … SET sold to A WHERE seat IN (3,4)</text><polygon points="136.26,524.602,126.26,528.602,136.26,532.602,132.26,528.602" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="130.26" y1="528.602" x2="726.783" y2="528.602" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="142.26" y="523.771" fill="#5A6B7D" font-size="12" textLength="55.605" font-family="'Segoe UI, Helvetica, Arial'">2 rows —</text><text x="201.679" y="523.771" fill="#5A6B7D" font-size="12" textLength="220.225" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">a sale after expiry, over B's hold</text><rect x="10" y="570.586" width="1172.97" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="570.586" x2="1182.97" y2="570.586" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="573.586" x2="1182.97" y2="573.586" style="stroke:#000;stroke-width:1;"/><rect x="362.689" y="56