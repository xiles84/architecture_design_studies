oe UI, Helvetica, Arial'">SELECT seats 3,4 — free?  → yes</text><polygon points="578.72,170.172,568.72,174.172,578.72,178.172,574.72,174.172" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="572.72" y1="174.172" x2="1114.308" y2="174.172" style="stroke:#5A6B7D;stroke-width:1;"/><text x="584.72" y="169.342" fill="#5A6B7D" font-size="12" textLength="195.99" font-family="'Segoe UI, Helvetica, Arial'">SELECT seats 3,4 — free?  → yes</text><polygon points="555.72,198.141,565.72,202.141,555.72,206.141,559.72,202.141" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="40.64" y1="202.141" x2="561.72" y2="202.141" style="stroke:#5A6B7D;stroke-width:1;"/><text x="47.64" y="197.311" fill="#5A6B7D" font-size="12" textLength="284.93" font-family="'Segoe UI, Helvetica, Arial'">UPDATE seats 3,4 SET held by A  (no condition)</text><polygon points="578.72,226.109,568.72,230.109,578.72,234.109,574.72,230.109" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="572.72" y1="230.109" x2="1114.308" y2="230.109" style="stroke:#5A6B7D;stroke-width:1;"/><text x="584.72" y="225.279" fill="#5A6B7D" font-size="12" textLength="350.701" font-family="'Segoe UI, Helvetica, Arial'">UPDATE seats 3,4 SET held by B  … waits for A's row locks</text><polygon points="555.72,254.078,565.72,258.078,555.72,262.078,559.72,258.078" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="40.64" y1="258.078" x2="561.72" y2="258.078" style="stroke:#5A6B7D;stroke-width:1;"/><text x="47.64" y="253.248" fill="#5A6B7D" font-size="12" textLength="49.4" font-family="'Segoe UI, Helvetica, Arial'">COMMIT</text><path d="M551.72,270.078 L614.667,270.078 L614.667,276.047 L604.667,286.047 L551.72,286.047 L551.72,270.078" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="551.72" y="270.078" width="579.588" height="101.875" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="566.72" y="282.217" fill="#000" font-size="12" textLength="17.947" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">alt</text><text x="629.667" y="283.217" fill="#000" font-size="12" textLength="322.225" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[S0 — READ COMMITTED (NEGATIVE CONTROL)]</text><polygon points="1103.308,312.016,1113.308,316.016,1103.308,320.016,1107.308,316.016" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="567.72" y1="316.016" x2="1109.308" y2="316.016" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="574.72" y="311.186" fill="#5A6B7D" font-size="12" textLength="55.605" font-family="'Segoe UI, Helvetica, Arial'">2 rows —</text><text x="634.14" y="311.186" fill="#5A6B7D" font-size="12" textLength="191.244" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">A's hold silently overwritten</text><text x="825.384" y="311.186" fill="#5A6B7D" font-size="12" textLength="235.143" font-family="'Segoe UI, Helvetica, Arial'">; both were told "yours for 40 minutes"</text><line x1="551.72" y1="325.016" x2="1131.308" y2="325.016" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="556.72" y="338.154" fill="#000" font-size="12" textLength="143.238" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[S4 — SERIALIZABLE]</text><polygon points="1103.308,359.953,1113.308,363.953,1103.308,367.953,1107.308,363.953" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="567.72" y1="363.953" x2="1109.308" y2="363.953" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="574.72" y="359.123" fill="#5A6B7D" font-size="12" textLength="355.787" font-family="'Segoe UI, Helvetica, Arial'">SQLSTATE 40001 → retry → seats now held → choose again</text><rect x="10" y="405.938" width="1135.959" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="405.938" x2="1145.959" y2="405.938" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="408.938" x2="1145.959" y2="408.938" style="stroke:#000;stroke-width:1;"/><rect x="474.455" y="395.953" width="207.049" height="21.969" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="480.455" y="411.092" fill="#000" font-size="12" textLength="188.871" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">S1: one conditional UPDATE</text><polygon points="555.72,443.891,565.72,447.891,555.72,451.891,559.72,447.891" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="40.64" y1="447.891" x2="561.72" y2="447.891" style="stroke:#5A6B7D;stroke-width:1;"/><text x="47.64" y="443.061" fill="#5A6B7D" font-size="12" textLength="503.08" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … WHERE seat IN (3,4) AND (available OR hold expired) → 2 rows, COMMIT</text><polygon points="578.72,471.859,568.72,475.859,578.72,479.859,574.72,475.859" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="572.72" y1="475.859" x2="1114.308" y2="475.859" style="stroke:#5A6B7D;stroke-width:1;"/><text x="584.72" y="471.029" fill="#5A6B7D" font-size="12" textLength="523.588" font-family="'Segoe UI, Helvetica, Arial'">same statement → waits, re-checks the new rows → 0 rows → ROLLBACK, choose again</text><rect x="10" y="503.844" width="1135.959" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="503.844" x2="1145.959" y2="503.844" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="506.844" x2="1145.959" y2="506.844" style="stroke:#000;stroke-width:1;"/><rect x="526.026" y="493.859" width="103.906" height="21.969" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="532.026" y="508.998" fill="#000" font-size="12" textLength="85.729" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">S2: lock first</text><polygon points="555.72,541.797,565.72,545.797,555.72,549.797,559.72,545.797" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="40.64" y1="545.797" x2="561.72" y2="545.797" style="stroke:#5A6B7D;stroke-width:1;"/><text x="47.64" y="540.967" fill="#5A6B7D" font-size="12" textLength="429.035" font-family="'Segoe UI, Helvetica, Arial'">SELECT … ORDER BY seat_id FOR UPDATE → free → UPDATE → COMMIT</text><polygon points="578.72,569.766,568.72,573.766,578.72,577.766,574.72,573.766" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="572.72" y1="573.766" x2="1114.308" y2="573.766" style="stroke:#5A6B7D;stroke-width:1;"/><text x="584.72" y="568.936" fill="#5A6B7D" font-size="12" textLength="155.555" font-family="'Segoe UI, Helvetica, Arial'">SELECT … FOR UPDATE →</text><text x="744.089" y="568.936" fill="#5A6B7D" font-size="12" textLength="36.176" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">waits</text><text x="784.079" y="568.936" fill="#5A6B7D" font-size="12" textLength="256.77" font-family="'Segoe UI, Helvetica, Arial'">for A, then sees them held → choose again</text><rect x="10" y="601.75" width="1135.959" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="601.75" x2="1145.959" y2="601.75" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="604.75" x2="1145.959" y2="604.75" style="stroke:#000;stroke-width:1;"/><rect x="493.949" y="591.766" width="168.061" height="21.969" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="499.949" y="606.904" fill="#000" font-size="12" textLength="149.883" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">S3: lock first, NOWAIT</text><polygon points="578.72,639.703,568.72,643.703,578.72,647.703,574.72,643.703" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="572.72" y1="643.703" x2="1114.308" y2="643.703" style="stroke:#5A6B7D;stroke-width:1;"/><text x="584.72" y="638.873" fill="#5A6B7D" font-size="12" textLength="396.223" font-family="'Segoe UI, Helvetica, Arial'">SELECT … FOR UPDATE NOWAIT → 55P03 at once → choose again</text><path d="M398.619,656.703 L398.619,691.703 L736.619,691.703 L736.619,666.703 L726.619,656.703 L398.619,656.703" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M726.619,656.703 L726.619,666.703 L736.619,666.703 L726.619,656.703" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="404.619" y="671.914" fill="#000" font-size="11" textLength="317.201" font-family="'Segoe UI, Helvetica, Arial'">With marked seats nobody may skip the seat they chose:</text><text x="404.619" y="684.718" fill="#000" font-size="11" textLength="221.407" font-family="'Segoe UI, Helvetica, Arial'">study 02's SKIP LOCKED does not apply.</text><?plantuml-src bLJDRjD04BxxAOPSIAoqSjlq4XIGdHY8wYR5DbHmgJRsbApgx5hUJLFVUk814C_0W_L9c5sdn842ucAjP-Vl--QRVSP5LgnpX2kbwm8Fo_MgS3JN1K823_VVG6yaBDOrLWgofPGAGIyH55lH1vbMmFJEif8h5DfnIbPfdl6I2GsTm4I3tm6cmD-_cZ3D5aoXlPi4JyK5zYvmdD484W-wSUXFO3m_Fv-cQJZf0HCv90Fe9c4yzQFf9p-8mjuGU4wDy8mLaBoBO3HoV3XuIILW24aOXUDqs_r9Vs1XNbU8hm0Uldo56fKJ_9VtBlVxYucVXYtl94nXYKKEYnfyWAwGa4cHSysbwBNA_3Kme5Btts73E5rUIoBpkO9ARg2GsKsxVCEBmmfjk3ATxjC5tLduna-d7qAopT9u7lKSCA47bC4aE3PfbOrqNLDbAQa5nGjYiwX1tcArgRZMA5pt1IoaNi86AzA4SUlKSbqr3GuyM76nrgWw3XOacgGXhZsb_SeqfYGr50myppkor5QegzgU6be48RQK6DDMZEmpuy91aJS2EHg25BYZcEQ_PNPF0bkR8VNoRHWtlCDq1bsYlWV-Z9XYjumNR46BC8yR6l2kv1NcFLk_OQh_IFbkairgQARHx8BrjOFh4vw3R8aqCRim0ZTRiid3snrfA57WZy_w-n0jlEEX7JbSyqhf9rLj8CtZIHX3yD6Ykk8vl2O4Zv2fWb6lFRHily5evVibt7Kj7jTjfDWtQ0JLGejhzOSHsVvFslttOJQ_zAUfmV6lkbjFa_NqzC8xCQ-E51a-KKT8ZLQeva41kEIaqHMhRZ3_AQE5p6korQ1kUDcyNjWyOxL9fd18WKgloSixfYL8pgON4Ct7PxH1kKIJGWChow8-DD8pl_W3?></g></svg>