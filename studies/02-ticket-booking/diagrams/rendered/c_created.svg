<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:757px;height:501px;background:#FFFFFF;" width="757px" height="501px" viewBox="0 0 757 501" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="btga1idx4wskq0" x="0" y="0" width="1" height="1"><feFlood flood-color="#D8F0DE" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="btga1idx4wskq1" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3CD" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="btga1idx4wskq2" x="0" y="0" width="1" height="1"><feFlood flood-color="#F5D0D0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="122.498" y="22.995" fill="#000" font-size="14" textLength="505.217" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C1-C5 — tickets created on booking: a row exists only once sold</text></g><!--class e--><g class="entity" data-qualified-name="e" id="ent0001" data-source-line="4"><rect x="18.65" y="44.297" width="285.906" height="102.828" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="18.65" y="44.297" width="285.906" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="18.65" y="64.602" width="285.906" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="18.65" y="44.297" width="285.906" height="102.828" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="145.938" y="59.507" fill="#000" font-size="11" textLength="31.33" font-family="'Segoe UI, Helvetica, Arial'">event</text><line x1="19.65" y1="67.102" x2="303.556" y2="67.102" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.65" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.65" y="81.312" fill="#000" font-size="11" textLength="125.877" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «PK»</text><line x1="19.65" y1="87.906" x2="303.556" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.65" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.65" y="102.117" fill="#000" font-size="11" textLength="121.918" font-family="'Segoe UI, Helvetica, Arial'">band_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.65" cy="112.613" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.65" y="114.921" fill="#000" font-size="11" textLength="75.33" font-family="'Segoe UI, Helvetica, Arial'">capacity : INT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.65" cy="125.418" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.65" y="127.726" fill="#000" font-size="11" textLength="99.784" font-family="'Segoe UI, Helvetica, Arial'">description : TEXT</text><text x="37.65" y="140.531" fill="#000" font-size="11" textLength="260.906" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btga1idx4wskq0)">* seats_sold : INT  (C4 only, CHECK 0..capacity)</text></g><!--class t--><g class="entity" data-qualified-name="t" id="ent0002" data-source-line="12"><rect x="7" y="278.357" width="309.209" height="136.438" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="7" y="278.357" width="309.209" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="7" y="298.662" width="309.209" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="7" y="278.357" width="309.209" height="136.438" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="97.361" y="293.567" fill="#000" font-size="11" textLength="128.487" font-family="'Segoe UI, Helvetica, Arial'">ticket  (sold seats only)</text><line x1="8" y1="301.162" x2="315.209" y2="301.162" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="313.064" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="315.372" fill="#000" font-size="11" textLength="125.415" font-family="'Segoe UI, Helvetica, Arial'">ticket_id : BIGINT «PK»</text><line x1="8" y1="321.966" x2="315.209" y2="321.966" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="333.869" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="336.177" fill="#000" font-size="11" textLength="125.571" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «FK»</text><text x="26" y="348.981" fill="#000" font-size="11" textLength="174.561" font-family="'Segoe UI, Helvetica, Arial'">seat_no : INT  (NOT NULL in C5)</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="359.478" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="361.786" fill="#000" font-size="11" textLength="115.543" font-family="'Segoe UI, Helvetica, Arial'">customer_id : BIGINT</text><text x="26" y="374.591" fill="#000" font-size="11" textLength="169.179" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btga1idx4wskq1)">event_capacity : INT  (C5 only)</text><line x1="8" y1="381.185" x2="315.209" y2="381.185" style="stroke:#5A6B7D;stroke-width:1;"/><text x="13" y="395.395" fill="#000" font-size="11" textLength="173.76" font-family="'Segoe UI, Helvetica, Arial'">C5: UNIQUE (event_id, seat_no)</text><text x="13" y="408.2" fill="#000" font-size="11" textLength="297.209" font-family="'Segoe UI, Helvetica, Arial'">C5: CHECK (seat_no BETWEEN 1 AND event_capacity)</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="26"><path d="M351,207.127 L351,343.027 L316.53,347.027 L351,351.027 L351,486.025 A0,0 0 0 0 351,486.025 L742.213,486.025 A0,0 0 0 0 742.213,486.025 L742.213,217.127 L732.213,207.127 L351,207.127 A0,0 0 0 0 351,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M732.213,207.127 L732.213,217.127 L742.213,217.127 L732.213,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="357" y="222.337" fill="#000" font-size="11" textLength="84.981" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C1 count (RC)</text><text x="441.981" y="222.337" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="448.975" y="222.337" fill="#000" font-size="11" textLength="112.879" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#btga1idx4wskq2)">NEGATIVE CONTROL</text><text x="357" y="235.142" fill="#000" font-size="11" textLength="216.17" font-family="'Segoe UI, Helvetica, Arial'">seats_left = capacity − COUNT(tickets)</text><text x="357" y="247.947" fill="#000" font-size="11" textLength="111.472" font-family="'Segoe UI, Helvetica, Arial'">if > 0: INSERT ticket</text><text x="357" y="260.751" fill="#000" font-size="11" textLength="215.542" font-family="'Segoe UI, Helvetica, Arial'">Two buyers both see the last seat free.</text><text x="357" y="273.556" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="357" y="286.361" fill="#000" font-size="11" textLength="92.345" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C2 count (SER)</text><text x="452.842" y="286.361" fill="#000" font-size="11" textLength="174.856" font-family="'Segoe UI, Helvetica, Arial'">— identical SQL, SERIALIZABLE;</text><text x="357" y="299.165" fill="#000" font-size="11" textLength="261.433" font-family="'Segoe UI, Helvetica, Arial'">the engine aborts one of the two (40001), retry</text><text x="357" y="311.97" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="357" y="324.775" fill="#000" font-size="11" textLength="88.935" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C3 count+lock</text><text x="357" y="337.58" fill="#000" font-size="11" textLength="126.35" font-family="'Segoe UI, Helvetica, Arial'">SELECT … FROM event</text><text x="486.846" y="337.58" fill="#000" font-size="11" textLength="78.821" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE</text><text x="565.667" y="337.58" fill="#000" font-size="11" textLength="93.479" font-family="'Segoe UI, Helvetica, Arial'">, then C1's count</text><text x="357" y="350.384" fill="#000" font-size="11" textLength="299.148" font-family="'Segoe UI, Helvetica, Arial'">— a per-event critical section around an O(sold) count</text><text x="357" y="363.189" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="357" y="375.994" fill="#000" font-size="11" textLength="67.439" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C4 counter</text><text x="357" y="388.798" fill="#000" font-size="11" textLength="260.804" font-family="'Segoe UI, Helvetica, Arial'">UPDATE event SET seats_sold = seats_sold + 1</text><text x="360.497" y="401.603" fill="#000" font-size="11" textLength="107.271" font-family="'Segoe UI, Helvetica, Arial'">WHERE event_id=$</text><text x="471.265" y="401.603" fill="#000" font-size="11" textLength="164.001" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">AND seats_sold &lt; capacity</text><text x="357" y="414.408" fill="#000" font-size="11" textLength="204.821" font-family="'Segoe UI, Helvetica, Arial'">no row → sold out; else INSERT ticket</text><text x="357" y="427.212" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="357" y="440.017" fill="#000" font-size="11" textLength="93.409" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">C5 seat-unique</text><text x="453.905" y="440.017" fill="#000" font-size="11" textLength="121.312" font-family="'Segoe UI, Helvetica, Arial'">(autocommit, no lock)</text><text x="357" y="452.822" fill="#000" font-size="11" textLength="199.772" font-family="'Segoe UI, Helvetica, Arial'">n = MAX(seat_no); INSERT seat n+1</text><text x="560.269" y="452.822" fill="#000" font-size="11" textLength="166.944" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">ON CONFLICT DO NOTHING</text><text x="357" y="465.626" fill="#000" font-size="11" textLength="218.904" font-family="'Segoe UI, Helvetica, Arial'">0 rows → another buyer took n+1, retry</text><text x="357" y="478.431" fill="#000" font-size="11" textLength="235.641" font-family="'Segoe UI, Helvetica, Arial'">Refunds leave holes that n+1 never refills.</text></g><!--link e to t--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="23" data-link-type="crowfoot"><path d="M161.6,155.387 C161.6,193.257 161.6,219.027 161.6,260.307" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="e-t" codeLine="23"/><line x1="157.6" y1="151.387" x2="165.6" y2="151.387" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="157.6" y1="154.387" x2="165.6" y2="154.387" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="161.6" y1="155.387" x2="161.6" y2="147.387" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="161.6" y1="270.307" x2="167.6" y2="278.307" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="161.6" y1="270.307" x2="155.6" y2="278.307" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="161.6" y1="270.307" x2="161.6" y2="278.307" style="stroke:#5A6B7D;stroke-width:1;"/><ellipse cx="161.6" cy="264.307" rx="4" ry="4" fill="none" style="stroke:#5A6B7D;stroke-width:1;"/></g><?plantuml-src VLJ1Rjj64BthArxJ0XLfIQKQ2oXaMO1CKROGXKfaAWbwCIXoP16cTrrocLH82kGKz1pq6_9X_fBCxfAo4mIz2EBip9ltPjxkJvb8yYebN9LgdrFlhhhDMofJES7lT_q1xZ_-1vKbDwHA90N5Yb98WOsKDvcu7Y968T-1_ivAJf0Yt_DFGYXbdhPQ91XgZoVqblyzGLo2yBu5k32Hgop546VpytaOOJHwyMmyviD