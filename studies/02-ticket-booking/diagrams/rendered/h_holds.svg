<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1132px;height:610px;background:#FFFFFF;" width="1132px" height="610px" viewBox="0 0 1132 610" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="366.128" y="27.995" fill="#000" font-size="14" textLength="397.954" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">H0 / H1 — holds with expiry, and the late payment</text></g><rect x="186.816" y="302.82" width="488.223" height="185.75" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>Buyer A</title><rect x="199.316" y="76.266" width="8" height="494.719" fill="#000" fill-opacity="0"/><line x1="202.816" y1="76.266" x2="202.816" y2="570.984" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="197.816" y="146.172" width="10" height="152.648" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><g><title>Database</title><rect x="655.539" y="76.266" width="8" height="494.719" fill="#000" fill-opacity="0"/><line x1="659.039" y1="76.266" x2="659.039" y2="570.984" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Sweeper</title><rect x="1013.341" y="76.266" width="8" height="494.719" fill="#000" fill-opacity="0"/><line x1="1016.841" y1="76.266" x2="1016.841" y2="570.984" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Buyer B</title><rect x="1087.058" y="76.266" width="8" height="494.719" fill="#000" fill-opacity="0"/><line x1="1090.558" y1="76.266" x2="1090.558" y2="570.984" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="172.176" y="47.297" width="61.279" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="179.176" y="65.436" fill="#000" font-size="12" textLength="47.279" font-family="'Segoe UI, Helvetica, Arial'">Buyer A</text><rect x="623.41" y="47.297" width="71.258" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="630.41" y="65.436" fill="#000" font-size="12" textLength="57.258" font-family="'Segoe UI, Helvetica, Arial'">Database</text><rect x="983.776" y="47.297" width="66.131" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="990.776" y="65.436" fill="#000" font-size="12" textLength="52.131" font-family="'Segoe UI, Helvetica, Arial'">Sweeper</text><rect x="1059.907" y="47.297" width="61.303" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1066.907" y="65.436" fill="#000" font-size="12" textLength="47.303" font-family="'Segoe UI, Helvetica, Arial'">Buyer B</text><rect x="172.176" y="570.984" width="61.279" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="179.176" y="589.123" fill="#000" font-size="12" textLength="47.279" font-family="'Segoe UI, Helvetica, Arial'">Buyer A</text><rect x="623.41" y="570.984" width="71.258" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="630.41" y="589.123" fill="#000" font-size="12" textLength="57.258" font-family="'Segoe UI, Helvetica, Arial'">Database</text><rect x="983.776" y="570.984" width="66.131" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="990.776" y="589.123" fill="#000" font-size="12" textLength="52.131" font-family="'Segoe UI, Helvetica, Arial'">Sweeper</text><rect x="1059.907" y="570.984" width="61.303" height="27.969" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1066.907" y="589.123" fill="#000" font-size="12" textLength="47.303" font-family="'Segoe UI, Helvetica, Arial'">Buyer B</text><polygon points="647.039,114.203,657.039,118.203,647.039,122.203,651.039,118.203" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.816" y1="118.203" x2="653.039" y2="118.203" style="stroke:#5A6B7D;stroke-width:1;"/><text x="209.816" y="99.404" fill="#5A6B7D" font-size="12" textLength="432.223" font-family="'Segoe UI, Helvetica, Arial'">hold: UPDATE event SET seats_taken+1 WHERE seats_taken &lt; capacity</text><text x="209.816" y="113.373" fill="#5A6B7D" font-size="12" textLength="269.502" font-family="'Segoe UI, Helvetica, Arial'">INSERT reservation (held, expires in 250 ms)</text><polygon points="647.039,142.172,657.039,146.172,647.039,150.172,651.039,146.172" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.816" y1="146.172" x2="653.039" y2="146.172" style="stroke:#5A6B7D;stroke-width:1;"/><text x="214.816" y="141.342" fill="#5A6B7D" font-size="12" textLength="305.848" font-family="'Segoe UI, Helvetica, Arial'">pre-payment check: held AND not expired?  → true</text><path d="M15,159.172 L15,181.172 L390,181.172 L390,169.172 L380,159.172 L15,159.172" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M380,159.172 L380,169.172 L390,169.172 L380,159.172" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="21" y="174.382" fill="#000" font-size="11" textLength="354.632" font-family="'Segoe UI, Helvetica, Arial'">paying… (card authorisation takes longer than the hold has left)</text><polygon points="670.039,230.883,660.039,234.883,670.039,238.883,666.039,234.883" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="664.039" y1="234.883" x2="1015.841" y2="234.883" style="stroke:#5A6B7D;stroke-width:1;"/><text x="676.039" y="202.115" fill="#5A6B7D" font-size="12" textLength="245.121" font-family="'Segoe UI, Helvetica, Arial'">expired holds FOR UPDATE SKIP LOCKED</text><text x="676.039" y="216.084" fill="#5A6B7D" font-size="12" textLength="333.803" font-family="'Segoe UI, Helvetica, Arial'">UPDATE reservation SET released WHERE status='held'</text><text x="676.039" y="230.053" fill="#5A6B7D" font-size="12" textLength="206.162" font-family="'Segoe UI, Helvetica, Arial'">UPDATE event SET seats_taken−1</text><polygon points="670.039,258.852,660.039,262.852,670.039,266.852,666.039,262.852" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="664.039" y1="262.852" x2="1089.558" y2="262.852" style="stroke:#5A6B7D;stroke-width:1;"/><text x="676.039" y="258.021" fill="#5A6B7D" font-size="12" textLength="203.309" font-family="'Segoe UI, Helvetica, Arial'">hold: the released seat → granted</text><polygon points="670.039,286.82,660.039,290.82,670.039,294.82,666.039,290.82" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="664.039" y1="290.82" x2="1089.558" y2="290.82" style="stroke:#5A6B7D;stroke-width:1;"/><text x="676.039" y="285.99" fill="#5A6B7D" font-size="12" textLength="139.342" font-family="'Segoe UI, Helvetica, Arial'">confirm → ticket issued</text><path d="M186.816,302.82 L249.763,302.82 L249.763,308.789 L239.763,318.789 L186.816,318.789 L186.816,302.82" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="186.816" y="302.82" width="488.223" height="185.75" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="201.816" y="314.959" fill="#000" font-size="12" textLength="17.947" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">alt</text><text x="264.763" y="315.959" fill="#000" font-size="12" textLength="293.426" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[H0 — naive confirm (NEGATIVE CONTROL)]</text><polygon points="647.039,358.727,657.039,362.727,647.039,366.727,651.039,362.727" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.816" y1="362.727" x2="653.039" y2="362.727" style="stroke:#5A6B7D;stroke-width:1;"/><text x="209.816" y="343.928" fill="#5A6B7D" font-size="12" textLength="419.918" font-family="'Segoe UI, Helvetica, Arial'">UPDATE reservation SET status='confirmed' WHERE reservation_id=$</text><text x="209.816" y="357.896" fill="#5A6B7D" font-size="12" textLength="80.871" font-family="'Segoe UI, Helvetica, Arial'">INSERT ticket</text><polygon points="213.816,386.695,203.816,390.695,213.816,394.695,209.816,390.695" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.816" y1="390.695" x2="658.039" y2="390.695" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="219.816" y="385.865" fill="#5A6B7D" font-size="12" textLength="49.354" font-family="'Segoe UI, Helvetica, Arial'">1 row —</text><text x="272.984" y="385.865" fill="#5A6B7D" font-size="12" textLength="215.889" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">the same seat is now sold twice</text><line x1="186.816" y1="399.695" x2="675.039" y2="399.695" style="stroke:#000;stroke-width:1;stroke-dasharray:2,2;"/><text x="191.816" y="412.834" fill="#000" font-size="12" textLength="161.168" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">[H1 — checked confirm]</text><polygon points="647.039,448.602,657.039,452.602,647.039,456.602,651.039,452.602" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="202.816" y1="452.602" x2="653.039" y2="452.602" style="stroke:#5A6B7D;stroke-width:1;"/><text x="209.816" y="433.803" fill="#5A6B7D" font-size="12" textLength="264.932" font-family="'Segoe UI, Helvetica, Arial'">UPDATE reservation SET status='confirmed'</text><text x="213.63" y="447.771" fill="#5A6B7D" font-size="12" textLength="412.617" font-family="'Segoe UI, Helvetica, Arial'">WHERE reservation_id=$ AND status='held' AND expires_at > now()</text><polygon points="213.816,476.57,203.816,480.57,213.816,484.57,209.816,480.57" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.816" y1="480.57" x2="658.039" y2="480.57" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:2,2;"/><text x="219.816" y="475.74" fill="#5A6B7D" font-size="12" textLength="158.854" font-family="'Segoe UI, Helvetica, Arial'">0 rows — refund, no ticket</text><path d="M421.599,507.57 L421.599,555.57 L895.599,555.57 L895.599,517.57 L885.599,507.57 L421.599,507.57" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M885.599,507.57 L885.599,517.57 L895.599,517.57 L885.599,507.57" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="427.599" y="522.781" fill="#000" font-size="11" textLength="420.234" font-family="'Segoe UI, Helvetica, Arial'">The pre-payment check is identical in H0 and H1 and was TRUE when it ran.</text><text x="427.599" y="535.585" fill="#000" font-size="11" textLength="453.879" font-family="'Segoe UI, Helvetica, Arial'">The only difference between the designs is the WHERE clause of the confirmation,</text><text x="427.599" y="548.39" fill="#000" font-size="11" textLength="388.76" font-family="'Segoe UI, Helvetica, Arial'">evaluated by the database clock in the same statement that confirms.</text><?plantuml-src dLH1Rjim4Bph5TkWG6mtIUC2lGHD2ZbMco217TXAUmbWCEBQ8a9J0abPrIsdekUWR-Z3_98kATcLs-JIao1oEPoPdUKheH9PS8IPiPN4exnOoi0AAn4kZk4jNFHX_VWJqano0wMmAU2tNEZg09ZYO5C4oIn2pgebAXi4ETDM929doiBUeAXGGxW7p42ukpLabjqpWtvlEDZTd9Q8EMg_DtqESk2t1a4Gmk4P7OSJp_04Rc-6OHm1heWCJACO339hPfOze7hJXwyNqIHghy47I5ZE4c6hEtKvcaQJ63GQr2jcHQQWawBa1xLcD20Kl7j_34lJRTsSQpniz4EIOl90PEWKXACXgCmsX_b7WFNt9x2wm80bLgoSRs505GZPoldai5Wbr6Bz-0iw2TCSM67JJ0jJit6K3SXCBQZSfapv1ZZba98V4kUs6qotn9gBc-Pz6ayszaolBc_WUdn-5GtlLBFMLksCqoYH-iCtdbbc2tEwxvJjRmyzw_FwnrC_6FpL64Tq2-cAlHaBJKr5tgfECZKNUbbR9P87j22CAQY6OykrW4dh0kgogPXOuVPWPnHz3kFBBn6SZqVnP7pT3G3-DEi5jHjv3Gho_KPtgt0c-EdhRKfgSeHDi8U4xhhN1vsLdbElvmGRjiHQh30KXHACQvKjHOAzNe3Iu6Q-V6x8cUR-_wDyfruW