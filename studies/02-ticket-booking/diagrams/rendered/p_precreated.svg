5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.83" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.83" y="81.312" fill="#000" font-size="11" textLength="125.877" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «PK»</text><line x1="19.83" y1="87.906" x2="302.689" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.83" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.83" y="102.117" fill="#000" font-size="11" textLength="121.918" font-family="'Segoe UI, Helvetica, Arial'">band_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.83" cy="112.613" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.83" y="114.921" fill="#000" font-size="11" textLength="75.33" font-family="'Segoe UI, Helvetica, Arial'">capacity : INT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="29.83" cy="125.418" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="37.83" y="127.726" fill="#000" font-size="11" textLength="99.784" font-family="'Segoe UI, Helvetica, Arial'">description : TEXT</text><text x="37.83" y="140.531" fill="#000" font-size="11" textLength="259.859" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b17uwclai66hsb0)">* seats_sold : INT  (P4 only, CHECK 0..capacity)</text></g><!--class t--><g class="entity" data-qualified-name="t" id="ent0002" data-source-line="12"><rect x="7" y="252.747" width="308.517" height="149.242" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="7" y="252.747" width="308.517" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="7" y="273.052" width="308.517" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="7" y="252.747" width="308.517" height="149.242" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="71.781" y="267.957" fill="#000" font-size="11" textLength="178.954" font-family="'Segoe UI, Helvetica, Arial'">ticket  (capacity rows per event)</text><line x1="8" y1="275.552" x2="314.517" y2="275.552" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="287.454" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="289.762" fill="#000" font-size="11" textLength="125.415" font-family="'Segoe UI, Helvetica, Arial'">ticket_id : BIGINT «PK»</text><line x1="8" y1="296.356" x2="314.517" y2="296.356" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="308.259" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="310.567" fill="#000" font-size="11" textLength="125.571" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="18" cy="321.063" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="323.371" fill="#000" font-size="11" textLength="71.645" font-family="'Segoe UI, Helvetica, Arial'">seat_no : INT</text><text x="26" y="336.176" fill="#000" font-size="11" textLength="148.441" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b17uwclai66hsb1)">* status : 'available' | 'sold'</text><text x="26" y="348.981" fill="#000" font-size="11" textLength="115.543" font-family="'Segoe UI, Helvetica, Arial'">customer_id : BIGINT</text><text x="26" y="361.785" fill="#000" font-size="11" textLength="127.762" font-family="'Segoe UI, Helvetica, Arial'">sold_at : TIMESTAMPTZ</text><line x1="8" y1="368.38" x2="314.517" y2="368.38" style="stroke:#5A6B7D;stroke-width:1;"/><text x="13" y="382.59" fill="#000" font-size="11" textLength="151.878" font-family="'Segoe UI, Helvetica, Arial'">UNIQUE (event_id, seat_no)</text><text x="13" y="395.395" fill="#000" font-size="11" textLength="296.517" font-family="'Segoe UI, Helvetica, Arial'">INDEX (event_id, seat_no) WHERE status = 'available'</text></g><g class="entity" data-qualified-name="GMN4" id="ent0005" data-source-line="27"><path d="M350.64,207.127 L350.64,323.827 L315.77,327.827 L350.64,331.827 L350.64,447.611 A0,0 0 0 0 350.64,447.611 L685.87,447.611 A0,0 0 0 0 685.87,447.611 L685.87,217.127 L675.87,207.127 L350.64,207.127 A0,0 0 0 0 350.64,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M675.87,207.127 L675.87,217.127 L685.87,217.127 L675.87,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="356.64" y="222.337" fill="#000" font-size="11" textLength="75.061" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P1 lock-first</text><text x="435.198" y="222.337" fill="#000" font-size="11" textLength="110.091" font-family="'Segoe UI, Helvetica, Arial'">(READ COMMITTED)</text><text x="356.64" y="235.142" fill="#000" font-size="11" textLength="205.6" font-family="'Segoe UI, Helvetica, Arial'">SELECT … ORDER BY seat_no LIMIT 1</text><text x="565.737" y="235.142" fill="#000" font-size="11" textLength="78.821" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE</text><text x="356.64" y="247.947" fill="#000" font-size="11" textLength="158.055" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … SET status='sold'</text><text x="356.64" y="260.751" fill="#000" font-size="11" textLength="240.679" font-family="'Segoe UI, Helvetica, Arial'">Every buyer waits on the same lowest seat.</text><text x="356.64" y="273.556" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="356.64" y="286.361" fill="#000" font-size="11" textLength="90.116" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P2 skip-locked</text><text x="356.64" y="299.165" fill="#000" font-size="11" textLength="98.726" font-family="'Segoe UI, Helvetica, Arial'">SELECT … LIMIT 1</text><text x="458.863" y="299.165" fill="#000" font-size="11" textLength="164.683" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE SKIP LOCKED</text><text x="356.64" y="311.97" fill="#000" font-size="11" textLength="158.055" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … SET status='sold'</text><text x="356.64" y="324.775" fill="#000" font-size="11" textLength="240.985" font-family="'Segoe UI, Helvetica, Arial'">no row → EXISTS(available)? retry : sold out</text><text x="356.64" y="337.58" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="356.64" y="350.384" fill="#000" font-size="11" textLength="44.054" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P3 CAS</text><text x="404.19" y="350.384" fill="#000" font-size="11" textLength="121.312" font-family="'Segoe UI, Helvetica, Arial'">(autocommit, no lock)</text><text x="356.64" y="363.189" fill="#000" font-size="11" textLength="234.588" font-family="'Segoe UI, Helvetica, Arial'">SELECT first available seat ≥ random start</text><text x="356.64" y="375.994" fill="#000" font-size="11" textLength="169.152" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … WHERE ticket_id=$</text><text x="529.288" y="375.994" fill="#000" font-size="11" textLength="141.582" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">AND status='available'</text><text x="356.64" y="388.798" fill="#000" font-size="11" textLength="155.268" font-family="'Segoe UI, Helvetica, Arial'">0 rows → lost the race, retry</text><text x="356.64" y="401.603" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="356.64" y="414.408" fill="#000" font-size="11" textLength="102.153" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P4 skip+counter</text><text x="356.64" y="427.212" fill="#000" font-size="11" textLength="229.464" font-family="'Segoe UI, Helvetica, Arial'">P2, then UPDATE event SET seats_sold+1</text><text x="356.64" y="440.017" fill="#000" font-size="11" textLength="255.82" font-family="'Segoe UI, Helvetica, Arial'">— every buyer queues on the event row again</text></g><g class="entity" data-qualified-name="GMN7" id="ent0008" data-source-line="48"><path d="M12.63,507.607 L12.63,568.826 A0,0 0 0 0 12.63,568.826 L309.892,568.826 A0,0 0 0 0 309.892,568.826 L309.892,517.607 L299.892,507.607 L165.26,507.607 L161.26,402.297 L157.26,507.607 L12.63,507.607 A0,0 0 0 0 12.63,507.607" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M299.892,507.607 L299.892,517.607 L309.892,517.607 L299.892,507.607" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="18.63" y="522.817" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b17uwclai66hsb2)"> </text><text x="22.127" y="522.817" fill="#000" font-size="11" textLength="154.247" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b17uwclai66hsb2)">The price of pre-creation</text><text x="176.374" y="522.817" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b17uwclai66hsb2)"> </text><text x="179.87" y="522.817" fill="#000" font-size="11" textLength="74.202" font-family="'Segoe UI, Helvetica, Arial'">: publishing a</text><text x="18.63" y="535.622" fill="#000" font-size="11" textLength="276.262" font-family="'Segoe UI, Helvetica, Arial'">100 000-seat event inserts 100 000 rows before a</text><text x="18.63" y="548.427" fill="#000" font-size="11" textLength="268.243" font-family="'Segoe UI, Helvetica, Arial'">single sale, and each sale leaves a dead entry in</text><text x="18.63" y="561.231" fill="#000" font-size="11" textLength="231.666" font-family="'Segoe UI, Helvetica, Arial'">the partial index until vacuum removes it.</text></g><!--link e to t--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="24" data-link-type="crowfoot"><path d="M161.26,155.407 C161.26,186.347 161.26,210.197 161.26,244.527" style="stroke:#5A6B7D;stroke-width