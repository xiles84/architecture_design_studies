<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:845px;height:766px;background:#FFFFFF;" width="845px" height="766px" viewBox="0 0 845 766" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs><filter id="b1624duox8tmxp0" x="0" y="0" width="1" height="1"><feFlood flood-color="#D8F0DE" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b1624duox8tmxp1" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFF3CD" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b1624duox8tmxp2" x="0" y="0" width="1" height="1"><feFlood flood-color="#FFCCCC" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="150.538" y="22.995" fill="#000" font-size="14" textLength="537.435" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P1-P4 — pre-created tickets: one row per seat, selling is an UPDATE</text></g><!--class e--><g class="entity" data-qualified-name="e" id="ent0001" data-source-line="4"><rect x="163.46" y="44.297" width="284.859" height="102.828" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="163.46" y="44.297" width="284.859" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="163.46" y="64.602" width="284.859" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="163.46" y="44.297" width="284.859" height="102.828" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="290.225" y="59.507" fill="#000" font-size="11" textLength="31.33" font-family="'Segoe UI, Helvetica, Arial'">event</text><line x1="164.46" y1="67.102" x2="447.319" y2="67.102" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="174.46" cy="79.004" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="182.46" y="81.312" fill="#000" font-size="11" textLength="125.877" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «PK»</text><line x1="164.46" y1="87.906" x2="447.319" y2="87.906" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="174.46" cy="99.809" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="182.46" y="102.117" fill="#000" font-size="11" textLength="121.918" font-family="'Segoe UI, Helvetica, Arial'">band_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="174.46" cy="112.613" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="182.46" y="114.921" fill="#000" font-size="11" textLength="75.33" font-family="'Segoe UI, Helvetica, Arial'">capacity : INT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="174.46" cy="125.418" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="182.46" y="127.726" fill="#000" font-size="11" textLength="99.784" font-family="'Segoe UI, Helvetica, Arial'">description : TEXT</text><text x="182.46" y="140.531" fill="#000" font-size="11" textLength="259.859" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1624duox8tmxp0)">* seats_sold : INT  (P4 only, CHECK 0..capacity)</text></g><!--class t--><g class="entity" data-qualified-name="t" id="ent0002" data-source-line="12"><rect x="151.63" y="310.367" width="308.517" height="149.242" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="151.63" y="310.367" width="308.517" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="151.63" y="330.672" width="308.517" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="151.63" y="310.367" width="308.517" height="149.242" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="216.411" y="325.577" fill="#000" font-size="11" textLength="178.954" font-family="'Segoe UI, Helvetica, Arial'">ticket  (capacity rows per event)</text><line x1="152.63" y1="333.172" x2="459.147" y2="333.172" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="162.63" cy="345.074" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="170.63" y="347.382" fill="#000" font-size="11" textLength="125.415" font-family="'Segoe UI, Helvetica, Arial'">ticket_id : BIGINT «PK»</text><line x1="152.63" y1="353.976" x2="459.147" y2="353.976" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="162.63" cy="365.879" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="170.63" y="368.187" fill="#000" font-size="11" textLength="125.571" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="162.63" cy="378.683" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="170.63" y="380.991" fill="#000" font-size="11" textLength="71.645" font-family="'Segoe UI, Helvetica, Arial'">seat_no : INT</text><text x="170.63" y="393.796" fill="#000" font-size="11" textLength="148.441" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1624duox8tmxp1)">* status : 'available' | 'sold'</text><text x="170.63" y="406.601" fill="#000" font-size="11" textLength="115.543" font-family="'Segoe UI, Helvetica, Arial'">customer_id : BIGINT</text><text x="170.63" y="419.405" fill="#000" font-size="11" textLength="127.762" font-family="'Segoe UI, Helvetica, Arial'">sold_at : TIMESTAMPTZ</text><line x1="152.63" y1="426" x2="459.147" y2="426" style="stroke:#5A6B7D;stroke-width:1;"/><text x="157.63" y="440.21" fill="#000" font-size="11" textLength="151.878" font-family="'Segoe UI, Helvetica, Arial'">UNIQUE (event_id, seat_no)</text><text x="157.63" y="453.015" fill="#000" font-size="11" textLength="296.517" font-family="'Segoe UI, Helvetica, Arial'">INDEX (event_id, seat_no) WHERE status = 'available'</text></g><!--class se--><g class="entity" data-qualified-name="se" id="ent0004" data-source-line="26"><rect x="65.41" y="622.847" width="198.954" height="128.438" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="65.41" y="622.847" width="198.954" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="65.41" y="643.152" width="198.954" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="65.41" y="622.847" width="198.954" height="128.438" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="69.058" y="638.057" fill="#000" font-size="11" textLength="191.657" font-family="'Segoe UI, Helvetica, Arial'">sale_event  (X1 only, append-only)</text><line x1="66.41" y1="645.652" x2="263.364" y2="645.652" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="657.554" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="659.862" fill="#000" font-size="11" textLength="173.954" font-family="'Segoe UI, Helvetica, Arial'">sale_event_id : BIGSERIAL «PK»</text><line x1="66.41" y1="666.456" x2="263.364" y2="666.456" style="stroke:#5A6B7D;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="678.359" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="680.667" fill="#000" font-size="11" textLength="125.571" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="691.163" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="693.471" fill="#000" font-size="11" textLength="71.645" font-family="'Segoe UI, Helvetica, Arial'">seat_no : INT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="703.968" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="706.276" fill="#000" font-size="11" textLength="115.543" font-family="'Segoe UI, Helvetica, Arial'">customer_id : BIGINT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="716.773" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="719.081" fill="#000" font-size="11" textLength="131.812" font-family="'Segoe UI, Helvetica, Arial'">kind : 'sold' | 'cancelled'</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="729.577" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="731.885" fill="#000" font-size="11" textLength="99.763" font-family="'Segoe UI, Helvetica, Arial'">at : TIMESTAMPTZ</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="76.41" cy="742.382" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="84.41" y="744.69" fill="#000" font-size="11" textLength="110.913" font-family="'Segoe UI, Helvetica, Arial'">price_cents : BIGINT</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="39"><path d="M495.28,207.127 L495.28,381.287 L460.4,385.287 L495.28,389.287 L495.28,562.853 A0,0 0 0 0 495.28,562.853 L830.51,562.853 A0,0 0 0 0 830.51,562.853 L830.51,217.127 L820.51,207.127 L495.28,207.127 A0,0 0 0 0 495.28,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M820.51,207.127 L820.51,217.127 L830.51,217.127 L820.51,207.127" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="501.28" y="222.337" fill="#000" font-size="11" textLength="75.061" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P1 lock-first</text><text x="579.838" y="222.337" fill="#000" font-size="11" textLength="110.091" font-family="'Segoe UI, Helvetica, Arial'">(READ COMMITTED)</text><text x="501.28" y="235.142" fill="#000" font-size="11" textLength="205.6" font-family="'Segoe UI, Helvetica, Arial'">SELECT … ORDER BY seat_no LIMIT 1</text><text x="710.377" y="235.142" fill="#000" font-size="11" textLength="78.821" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE</text><text x="501.28" y="247.947" fill="#000" font-size="11" textLength="158.055" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … SET status='sold'</text><text x="501.28" y="260.751" fill="#000" font-size="11" textLength="240.679" font-family="'Segoe UI, Helvetica, Arial'">Every buyer waits on the same lowest seat.</text><text x="501.28" y="273.556" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="501.28" y="286.361" fill="#000" font-size="11" textLength="90.116" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P2 skip-locked</text><text x="501.28" y="299.165" fill="#000" font-size="11" textLength="98.726" font-family="'Segoe UI, Helvetica, Arial'">SELECT … LIMIT 1</text><text x="603.503" y="299.165" fill="#000" font-size="11" textLength="164.683" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE SKIP LOCKED</text><text x="501.28" y="311.97" fill="#000" font-size="11" textLength="158.055" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … SET status='sold'</text><text x="501.28" y="324.775" fill="#000" font-size="11" textLength="240.985" font-family="'Segoe UI, Helvetica, Arial'">no row → EXISTS(available)? retry : sold out</text><text x="501.28" y="337.58" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="501.28" y="350.384" fill="#000" font-size="11" textLength="44.054" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P3 CAS</text><text x="548.83" y="350.384" fill="#000" font-size="11" textLength="121.312" font-family="'Segoe UI, Helvetica, Arial'">(autocommit, no lock)</text><text x="501.28" y="363.189" fill="#000" font-size="11" textLength="234.588" font-family="'Segoe UI, Helvetica, Arial'">SELECT first available seat ≥ random start</text><text x="501.28" y="375.994" fill="#000" font-size="11" textLength="169.152" font-family="'Segoe UI, Helvetica, Arial'">UPDATE … WHERE ticket_id=$</text><text x="673.928" y="375.994" fill="#000" font-size="11" textLength="141.582" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">AND status='available'</text><text x="501.28" y="388.798" fill="#000" font-size="11" textLength="155.268" font-family="'Segoe UI, Helvetica, Arial'">0 rows → lost the race, retry</text><text x="501.28" y="401.603" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="501.28" y="414.408" fill="#000" font-size="11" textLength="102.153" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">P4 skip+counter</text><text x="501.28" y="427.212" fill="#000" font-size="11" textLength="229.464" font-family="'Segoe UI, Helvetica, Arial'">P2, then UPDATE event SET seats_sold+1</text><text x="501.28" y="440.017" fill="#000" font-size="11" textLength="255.82" font-family="'Segoe UI, Helvetica, Arial'">— every buyer queues on the event row again</text><text x="501.28" y="452.822" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'"> </text><text x="501.28" y="465.626" fill="#000" font-size="11" textLength="93.554" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">X1 CAS+ledger</text><text x="598.33" y="465.626" fill="#000" font-size="11" textLength="107.707" font-family="'Segoe UI, Helvetica, Arial'">(P3, plus one thing)</text><text x="501.28" y="478.431" fill="#000" font-size="11" textLength="263.49" font-family="'Segoe UI, Helvetica, Arial'">P3's UPDATE, as a data-modifying CTE that also</text><text x="501.28" y="491.236" fill="#000" font-size="11" textLength="257.157" font-family="'Segoe UI, Helvetica, Arial'">INSERTs into sale_event -- same statement, so</text><text x="501.28" y="504.04" fill="#000" font-size="11" textLength="257.592" font-family="'Segoe UI, Helvetica, Arial'">"sold" and "cancelled" are provably never split</text><text x="501.28" y="516.845" fill="#000" font-size="11" textLength="249.541" font-family="'Segoe UI, Helvetica, Arial'">from the ticket row's own state change. Buys</text><text x="501.28" y="529.65" fill="#000" font-size="11" textLength="268.882" font-family="'Segoe UI, Helvetica, Arial'">r01/r03/r05 (REPORTS.md); r01 becomes correct</text><text x="501.28" y="542.455" fill="#000" font-size="11" textLength="256.733" font-family="'Segoe UI, Helvetica, Arial'">across refunds. Costs one extra insert per sale</text><text x="501.28" y="555.259" fill="#000" font-size="11" textLength="115.957" font-family="'Segoe UI, Helvetica, Arial'">and per cancellation.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="69"><path d="M299.26,656.457 L299.26,717.676 A0,0 0 0 0 299.26,717.676 L596.522,717.676 A0,0 0 0 0 596.522,717.676 L596.522,666.457 L586.522,656.457 L383.7,656.457 L379.7,460.047 L375.7,656.457 L299.26,656.457 A0,0 0 0 0 299.26,656.457" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M586.522,656.457 L586.522,666.457 L596.522,666.457 L586.522,656.457" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="305.26" y="671.667" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1624duox8tmxp2)"> </text><text x="308.757" y="671.667" fill="#000" font-size="11" textLength="154.247" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1624duox8tmxp2)">The price of pre-creation</text><text x="463.004" y="671.667" fill="#000" font-size="11" font-family="'Segoe UI, Helvetica, Arial'" filter="url(#b1624duox8tmxp2)"> </text><text x="466.5" y="671.667" fill="#000" font-size="11" textLength="74.202" font-family="'Segoe UI, Helvetica, Arial'">: publishing a</text><text x="305.26" y="684.472" fill="#000" font-size="11" textLength="276.262" font-family="'Segoe UI, Helvetica, Arial'">100 000-seat event inserts 100 000 rows before a</text><text x="305.26" y="697.277" fill="#000" font-size="11" textLength="268.243" font-family="'Segoe UI, Helvetica, Arial'">single sale, and each sale leaves a dead entry in</text><text x="305.26" y="710.081" fill="#000" font-size="11" textLength="231.666" font-family="'Segoe UI, Helvetica, Arial'">the partial index until vacuum removes it.</text></g><!--link e to t--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="24" data-link-type="crowfoot"><path d="M305.89,155.427 C305.89,200.687 305.89,250.997 305.89,302.067" style="stroke:#5A6B7D;stroke-width:1;" fill="none" id="e-t" codeLine="24"/><line x1="301.89" y1="151.427" x2="309.89" y2="151.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="301.89" y1="154.427" x2="309.89" y2="154.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="305.89" y1="155.427" x2="305.89" y2="147.427" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="305.89" y1="302.067" x2="311.89" y2="310.067" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="305.89" y1="302.067" x2="299.89" y2="310.067" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="305.89" y1="302.067" x2="305.89" y2="310.067" style="stroke:#5A6B7D;stroke-width:1;"/><line x1="309.89" y1="300.067" x2="301.89" y2="300.067" style="stroke:#5A6B7D;stroke-width:1;"/></g><!--link t to se--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="36" data-link-type="dependency"><path d="M208,460.047 C208,509.937 208,569.777 208,617.377" style="stroke:#5A6B7D;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="t-to-se" codeLine="36"/><polygon points="208,622.377,212,613.377,208,617.377,204,613.377,208,622.377" fill="#5A6B7D" style="stroke:#5A6B7D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="84.854" y="524.356" fill="#5A6B7D" font-size="12" textLength="45.053" font-family="'Segoe UI, Helvetica, Arial'">