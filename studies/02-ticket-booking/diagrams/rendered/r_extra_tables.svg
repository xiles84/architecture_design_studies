idth:0.5;" fill="#FBFBF6"/><text x="12" y="346.757" fill="#000" font-size="11" textLength="16.124" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">R1</text><text x="31.621" y="346.757" fill="#000" font-size="11" textLength="181.602" font-family="'Segoe UI, Helvetica, Arial'">— C4's guarded counter, moved:</text><text x="12" y="359.562" fill="#000" font-size="11" textLength="243.665" font-family="'Segoe UI, Helvetica, Arial'">UPDATE event_inventory SET remaining − 1</text><text x="15.497" y="372.367" fill="#000" font-size="11" textLength="217.481" font-family="'Segoe UI, Helvetica, Arial'">WHERE event_id=$ AND remaining > 0</text><text x="12" y="385.171" fill="#000" font-size="11" textLength="220.172" font-family="'Segoe UI, Helvetica, Arial'">The organiser's edits to event no longer</text><text x="12" y="397.976" fill="#000" font-size="11" textLength="155.413" font-family="'Segoe UI, Helvetica, Arial'">share a row with every sale.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="47"><path d="M305.58,331.547 L305.58,405.57 A0,0 0 0 0 305.58,405.57 L617.086,405.57 A0,0 0 0 0 617.086,405.57 L617.086,341.547 L607.086,331.547 L465.33,331.547 L461.33,271.857 L457.33,331.547 L305.58,331.547 A0,0 0 0 0 305.58,331.547" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M607.086,331.547 L607.086,341.547 L617.086,341.547 L607.086,331.547" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="311.58" y="346.757" fill="#000" font-size="11" textLength="16.124" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">R2</text><text x="331.201" y="346.757" fill="#000" font-size="11" textLength="133.767" font-family="'Segoe UI, Helvetica, Arial'">— the counter, sharded:</text><text x="311.58" y="359.562" fill="#000" font-size="11" textLength="179.416" font-family="'Segoe UI, Helvetica, Arial'">pick a random bucket with seats</text><text x="311.58" y="372.367" fill="#000" font-size="11" textLength="227.853" font-family="'Segoe UI, Helvetica, Arial'">FOR UPDATE SKIP LOCKED, decrement it.</text><text x="311.58" y="385.171" fill="#000" font-size="11" textLength="202.001" font-family="'Segoe UI, Helvetica, Arial'">Up to 8 buyers of one event at once.</text><text x="311.58" y="397.976" fill="#000" font-size="11" textLength="290.506" font-family="'Segoe UI, Helvetica, Arial'">none unlocked → EXISTS(remaining)? retry : sold out</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="55"><path d="M652.37,337.947 L652.37,399.166 A0,0 0 0 0 652.37,399.166 L912.292,399.166 A0,0 0 0 0 912.292,399.166 L912.292,347.947 L902.292,337.947 L739.92,337.947 L735.92,254.927 L731.92,337.947 L652.37,337.947 A0,0 0 0 0 652.37,337.947" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><path d="M902.292,337.947 L902.292,347.947 L912.292,347.947 L902.292,337.947" style="stroke:#BDBDB0;stroke-width:0.5;" fill="#FBFBF6"/><text x="658.37" y="353.157" fill="#000" font-size="11" textLength="16.124" font-weight="700" font-family="'Segoe UI, Helvetica, Arial'">R3</text><text x="677.991" y="353.157" fill="#000" font-size="11" textLength="171.714" font-family="'Segoe UI, Helvetica, Arial'">— seats pre-created as tokens:</text><text x="658.37" y="365.962" fill="#000" font-size="11" textLength="238.509" font-family="'Segoe UI, Helvetica, Arial'">pick lowest slot FOR UPDATE SKIP LOCKED,</text><text x="658.37" y="378.767" fill="#000" font-size="11" textLength="238.922" font-family="'Segoe UI, Helvetica, Arial'">DELETE it, INSERT the ticket with that seat.</text><text x="658.37" y="391.571" fill="#000" font-size="11" textLength="193.982" font-family="'Segoe UI, Helvetica, Arial'">The pool shrinks as the event sells.</text></g><!--link e to i--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="33" data-link-type="association"><path d="M509.53,82.567 C387.57,82.567 169.33,82.567 169.33,82.567 C169.33,82.567 169.33,143.387 169.3