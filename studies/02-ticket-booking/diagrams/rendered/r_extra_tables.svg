ca, Arial'" filter="url(#b2e9faue064c80)">* remaining : INT  CHECK 0..bucket_capacity</text></g><!--class s--><g class="entity" data-qualified-name="s" id="ent0004" data-source-line="22"><rect x="631.19" y="198.327" width="188.29" height="56.414" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="631.19" y="198.327" width="188.29" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="631.19" y="218.632" width="188.29" height="2.5" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;"/><rect x="631.19" y="198.327" width="188.29" height="56.414" fill="none" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="634.19" y="213.537" fill="#000" font-size="11" textLength="182.29" font-family="'Segoe UI, Helvetica, Arial'">seat_slot  (R3: unsold seats only)</text><line x1="632.19" y1="221.132" x2="818.48" y2="221.132" style="stroke:#5A6B7D;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="642.19" cy="233.034" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="650.19" y="235.342" fill="#000" font-size="11" textLength="146.411" font-family="'Segoe UI, Helvetica, Arial'">event_id : BIGINT «PK, FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="642.19" cy="245.839" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="650.19" y="248.147" fill="#000" font-size="11" textLength="102.448" font-family="'Segoe UI, Helvetica, Arial'">seat_no : INT «PK»</text></g><!--class t--><g class="entity" data-qualified-name="t" id="ent0005" data-source-line="26"><rect x="854.57" y="181.517" width="199.523" height="90.023" fill="#FFF" style="stroke:#5A6B7D;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="854.57" y="181.517" width="199.523" height="22.805" fill="#E8EDF4" style="stroke:#E8EDF4;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="854.57" y="201.822" width="199.523" height="2.5" fill="#E8EDF4" style="stroke:#E8ED